/* 施工担当別の集計（発注額＝原価、売上） */
function workerData(fromYm,n){
  const tm=fromYm, months=[...Array(n)].map((_,i)=>ymAdd(tm,i)), idx=m=>months.indexOf(m);
  const map=new Map(); const row=id=>{ if(!map.has(id)) map.set(id,{id,cost:Array(n).fill(0),sales:Array(n).fill(0),nOrd:0,nVis:0}); return map.get(id); };
  // スポット：発注書（作成中も含む）
  all('orders').forEach(o=>{ if(o.status==='中止') return; const m=ymOf(o.workDate||o.issuedAt||o.createdAt); const i=idx(m); if(i<0) return; const r=row(o.supplierId||''); r.cost[i]+=qcalc(o).sub; r.nOrd++; const j=get('jobs',o.jobId); if(j&&j.type!=='定期'){ const os=jobOrders(j.id); const tot=os.reduce((a,x)=>a+qcalc(x).sub,0)||1; r.sales[i]+=jobMoney(j).sales*qcalc(o).sub/tot; } });
  // 定期：作業予定（なければ契約の周期）を担当で按分
  const seen=new Set();
  const addC=(c,m,ids,q,v)=>{ const i=idx(recM(c,m)); if(i<0) return; const k=ids.length?ids:['']; const qty=q!=null&&q!==''?num(q):(num(c.qty)||1); const pr=priceAt(c,m); const sales=v?visitAmount(v):pr.price*qty, cost=v?visitCost(v):pr.cost*qty; k.forEach(id=>{ const r=row(id); r.cost[i]+=cost/k.length; r.sales[i]+=sales/k.length; r.nVis++; }); };
  all('visits').forEach(v=>{ if(!v.contractId||v.status==='中止') return; const c=get('contracts',v.contractId); if(!c||c.active===false||c.cycle?.kind==='flat') return; seen.add(c.id+'|'+vMonth(v)); addC(c,vMonth(v),v.staffIds||[],v.qty,v); });
  all('contracts').filter(c=>c.active!==false&&c.cycle?.kind!=='flat').forEach(c=>cycleMonths(c,ymAdd(tm,-1),n+1).forEach(m=>{ if(!seen.has(c.id+'|'+m)) addC(c,m,c.staffIds||[],null); }));
  const rows=[...map.values()].map(r=>({...r,costT:r.cost.reduce((a,b)=>a+b,0),salesT:r.sales.reduce((a,b)=>a+b,0)}));
  const order=staffList().map(s=>s.id);
  rows.sort(by(r=>r.id===''?999:(order.indexOf(r.id)<0?998:order.indexOf(r.id))));
  return {months,rows};
}
function siteYear(sid,tm){ return all('contracts').filter(x=>x.siteId===sid&&x.active!==false).reduce((a,x)=>a+contractRevenueIn(x,tm,12),0); }
function siteTable(q,tm){
  const ss=all('sites').filter(s=>!q||[siteLabel(s),custName(s.customerId),s.storeNo].join(' ').includes(q)).sort(by(s=>custName(s.customerId)+'|'+siteLabel(s)));
  if(!ss.length) return `<p class="empty">該当する現場はありません。</p>`;
  return `<div class="panel scroll"><table class="t"><thead><tr><th>現場</th><th>顧客</th><th class="r">定期契約</th><th class="r">年間見込み</th><th class="r">スポット案件</th><th>次の作業</th></tr></thead><tbody>${
    ss.map(s=>{const ks=all('contracts').filter(x=>x.siteId===s.id&&x.active!==false); const js=all('jobs').filter(j=>j.siteId===s.id&&j.type!=='定期'); const nx=nextVisitOfSite(s.id);
      return `<tr class="click" data-act="site-view" data-id="${s.id}"><td><b>${esc(siteLabel(s))}</b>${s.storeNo?`<div class="small muted">店番 ${esc(s.storeNo)}</div>`:''}</td><td class="small">${esc(custName(s.customerId))}</td><td class="r num">${ks.length||''}</td><td class="r num">${ks.length?man(siteYear(s.id,tm)):''}</td><td class="r num">${js.length||''}</td><td class="small">${nx?`${nx.date?jd(nx.date):ymLabel(nx.month)+'（未定）'}　${esc(nx.c?.service||nx.title||'')}`:''}</td></tr>`;}).join('')}</tbody></table></div>`;
}
function siteVisits(sid){ return all('visits').filter(v=>{const c=get('contracts',v.contractId), j=get('jobs',v.jobId); return (c&&c.siteId===sid)||(j&&j.siteId===sid)||(!c&&!j&&v.siteId===sid);}).map(v=>({...v,c:get('contracts',v.contractId)})); }
function nextVisitOfSite(sid){ const t=today(), tm=ymOf(t); return siteVisits(sid).filter(v=>isOpenVisit(v)&&(v.date?v.date>=t:vMonth(v)>=tm)).sort(by(v=>v.date||vMonth(v)+'-99'))[0]; }
const jobClosedDate=j=>j.closedAt||j.completedAt||(j.updatedAt||'').slice(0,10);
const isArchived=j=>['完了','失注'].includes(j.stage)&&daysSince(jobClosedDate(j))>(num(S().archiveDays)||30);
const jobMonthKey=j=>VS.jobView==='archive'?ymOf(jobClosedDate(j)):jobMonthOf(j);
const jobMonthOf=j=>ymOf(j.workDate||j.receivedAt||(j.createdAt||'').slice(0,10));
function jobMonthSel(){

    </div><p class="small muted" style="margin:8px 0 0">発注書ごとに了承期限を変えることもできます（発注書の「協力会社の了承」）。質問はまず案件の営業担当に表示されます。</p></section>
    <section class="sec"><h3>完了報告書アプリとの連携</h3>

      <p class="small muted" style="margin:8px 0 0">作業予定の画面から「完了報告書を作成」を押すと、このアプリが開き、店名・作業日・作業内容がコピーされます。できあがった報告書（PDFや写真）は、作業予定に添付して残せます。</p>

      <tr><td>5 パート・アルバイト</td><td>打刻、シフト希望、自分のシフト</td><td>見えない</td><td>勤怠の修正は承認が必要</td></tr>
      <tr><td>協力会社（社外）</td><td>自社あての発注書・限定した現場情報・前回の施工報告</td><td>自社の発注金額のみ</td><td>―</td></tr>

    <h3 style="margin-top:14px">追加するときの手順</h3>

/* 案件詳細（自動保存） */
SHEETS.job=({id})=>{
  const j=get('jobs',id); if(!j) return {title:'案件',body:'<p class="empty">この案件は削除されました。</p>'};
  const m=jobMoney(j), qs=jobQuotes(id), vs=all('visits').filter(v=>v.jobId===id).sort(by(v=>v.date||'9'));
  const ctr=get('contracts',j.contractId);
  const recCand=j.type!=='定期'&&j.stage==='完了'&&!j.recurringDone;
  const lastQ=qs.filter(q=>q.issuedAt).slice(-1)[0];
  return {title:esc(j.title)+exMark(j),
  head:`<span class="pill ${STAGE_TONE[j.stage]}">${esc(j.stage)}</span>`,
  body:`
  ${recCand?`<div class="callout"><b>定期化のチャンス</b><span>完了したスポット案件です。定期清掃の提案をしましたか？</span><button class="btn pri sm" data-act="to-contract" data-id="${id}">定期契約にする</button><button class="btn sm" data-act="no-recurring" data-id="${id}">提案済み・見送り</button></div>`:''}
  ${jobAllDone(j)?`<div class="callout"><b>作業完了</b><span>作業予定がすべて完了しました。案件を完了にしますか？${jobOrders(id).some(o=>o.status==='発行済')?'発行済みの発注書も「完了」にします。':''}</span><button class="btn pri sm" data-act="job-finish" data-id="${id}">案件を完了にする</button></div>`:''}
  ${j.stage==='施工'&&!jobOrders(id).length&&!j.orderSkip?`<div class="callout"><b>発注書</b><span>施工に移りました。施工担当への発注書を作成しますか？</span><button class="btn pri sm" data-act="new-order" data-id="${id}">発注書を作成</button><button class="btn sm" data-act="order-skip" data-id="${id}">発注なし（自社施工）</button></div>`:''}
  ${ctr?`<div class="callout"><span>定期契約：</span><button class="btn sm" data-act="contract" data-id="${ctr.id}">${esc(ctr.service)}（${esc(cycleText(ctr.cycle))}）を開く</button></div>`:''}
  ${j.stage==='見積'&&lastQ?`<div class="callout w"><span>見積提出から ${daysSince(lastQ.issuedAt)}日${j.lastContact?`／最終連絡 ${esc(j.lastContact)}`:''}</span><button class="btn sm" data-act="contacted" data-id="${id}">今日連絡した</button></div>`:''}
  <section class="sec"><h3>進み具合</h3><div class="stages">${STAGES.map(s=>`<button class="${s==='失注'?'lost':''}" data-act="stage" data-id="${id}" data-v="${s}" aria-pressed="${j.stage===s}">${s}</button>`).join('')}</div>
    ${(()=>{ const n=nextStep(j); return n?`<div class="flow ${n.stale?'stale':''}" style="margin-top:8px"><span>${n.stale?'⚠ ':'→ '}次にやること：${esc(n.txt)}</span>${(n.btns||[]).map(([a,l,x])=>`<button class="btn sm" data-act="${a}" data-id="${esc(x)}">${esc(l)}</button>`).join('')}</div>`:''; })()}${stageLogHtml(j)}
    ${['完了','失注'].includes(j.stage)?`<p class="small muted" style="margin:8px 0 0">${j.stage}日 ${esc(jobClosedDate(j))}${isArchived(j)?'（「過去の案件」に表示中）':`（${Math.max(0,(num(S().archiveDays)||30)-daysSince(jobClosedDate(j)))}日後に「過去の案件」へ移ります）`}</p>`:''}
    ${j.stage==='失注'?`<div class="form" style="margin-top:10px">${fld('失注理由',`<select class="inp" data-jf="lostReason">${opt('','（選択）',j.lostReason)}${LOST_REASONS.map(r=>opt(r,r,j.lostReason)).join('')}</select>`)}${fld('失注メモ',`<input class="inp" data-jf="lostNote" value="${esc(j.lostNote)}">`)}</div>`:''}</section>
  <section class="sec"><h3>基本情報<span class="sp small muted">変更は自動で保存されます</span></h3><div class="form">
    ${fld('案件名',`<input class="inp" data-jf="title" value="${esc(j.title)}">`,true)}
    ${fld('顧客',`<select class="inp" data-jf="customerId">${custOpts(j.customerId)}</select>`)}
    ${fld('現場・店舗',`<select class="inp" data-jf="siteId">${siteOpts(j.customerId,j.siteId)}</select>`)}
    ${fld('種別',`<select class="inp" data-jf="type">${opt('スポット','スポット',j.type)}${opt('定期','定期',j.type)}</select>`)}
    ${fld('作業内容',`<input class="inp" data-jf="service" value="${esc(j.service)}" placeholder="例：床面洗浄ワックス">`)}
    ${fld('営業担当',`<select class="inp" data-jf="ownerId">${staffOpts(j.ownerId,salesStaff())}</select>`)}
    ${fld('施工担当・協力会社',`<select class="inp" data-jf="workerId">${staffOpts(j.workerId)}</select>`)}
    ${fld('受付日',`<input class="inp" type="date" data-jf="receivedAt" value="${esc(j.receivedAt)}">`)}
    ${(()=>{ const os=jobOrders(id), rows=os.flatMap(o=>orderRows(o)); if(!rows.length) return fld('作業予定日',`<input class="inp" type="date" data-jf="workDate" value="${esc(j.workDate)}">`); const f=firstDate(rows), l=lastDate(rows); return fld('作業期間（発注書の日程から自動）',`<div class="inp" style="background:var(--surface-2)">${f===l?jd(f):`${jd(f)} 〜 ${jd(l)}`}<span class="small muted">　発注書${os.length}件・作業${rows.length}日／売上は最終日の月</span></div>`); })()}
    ${fld('受注予定金額（見積なしの場合）',`<input class="inp num" inputmode="numeric" data-jf="expectedAmount" value="${esc(j.expectedAmount)}">`)}
    ${fld('きっかけ',`<select class="inp" data-jf="source">${opt('','（選択）',j.source)}${SOURCES.map(s=>opt(s,s,j.source)).join('')}</select>`)}
    ${fld('メモ（現場の注意点・鍵など）',`<textarea class="inp" data-jf="memo">${esc(j.memo)}</textarea>`,true)}
  </div></section>
  <section class="sec"><h3>見積 <span class="num muted">${qs.length}</span><span class="sp"><button class="btn sm" data-act="new-quote" data-id="${id}">＋ 見積を作成</button></span></h3>
    ${(()=>{const openQ=qs.filter(q=>['作成中','提出済'].includes(q.status)); return m.wonCount&&openQ.length&&!j.keepOpenQuotes?`<div class="callout w" style="margin-bottom:10px"><span>受注した見積のほかに、未決定の見積が${openQ.length}件あります（${openQ.map(q=>esc(q.title||q.no||'見積')).join('、')}）。不採用にしますか？</span><button class="btn sm" data-act="reject-open" data-id="${id}">不採用（失注）にする</button><button class="btn sm" data-act="keep-open" data-id="${id}">このままにする</button></div>`:'';})()}
    ${qs.length?`<div class="list">${qs.map(q=>{const c=qcalc(q), use=(m.used||[]).some(x=>x.id===q.id);return `<div class="li" data-act="quote" data-id="${q.id}"><span class="pill ${Q_TONE[q.status]}">${esc(q.status)}</span><div class="grow"><div>${esc(q.title||'見積')}${use?` <span class="pill ${m.fixed?'g':''}">${m.fixed?'売上に計上':'見込みに使用'}</span>`:''}</div><div class="small muted">${esc(q.no||'')}　${q.issuedAt?'提出 '+esc(q.issuedAt):'未提出'}</div></div><span class="num">${yen(c.total)}</span></div>`;}).join('')}</div>
    <p class="small muted" style="margin:8px 0 0">${m.wonCount?`受注した見積 ${m.wonCount}件の合計（税抜）：<b class="num">${yen(m.sales)}</b>。受注した見積はすべて合計して案件の売上にします。`:'受注した見積はまだありません。売上の見込みには、最後に作った見積（失注を除く）を使っています。'}</p>`:'<p class="empty">見積はまだありません。テンプレートや過去の見積から作れます。</p>'}
  </section>
  <section class="sec"><h3>発注書 <span class="num muted">${jobOrders(id).length}</span><span class="sp"><button class="btn sm" data-act="new-order" data-id="${id}">＋ 発注書を作成</button></span></h3>
    ${jobOrders(id).length?`<div class="list">${jobOrders(id).map(o=>{const c=qcalc(o);return `<div class="li" data-act="order" data-id="${o.id}"><span class="pill ${O_TONE[o.status]}">${esc(o.status)}</span>${poPill(o.id)}<div class="grow"><div>${esc(staffName(o.supplierId)||'発注先未設定')}　${esc(o.title||'')}</div><div class="small muted">${esc(o.no||'')}　${o.workDate?'作業日 '+esc(o.workDate):''}</div></div><span class="num">${yen(c.total)}</span></div>`;}).join('')}</div>`:'<p class="empty">発注書はまだありません。施工担当（協力会社や自社の班）への発注内容を、受注見積の原価から作れます。</p>'}
  </section>
  <section class="sec"><h3>収支${m.fixed?' <span class="pill g">受注見積で確定</span>':' <span class="pill">見込み</span>'}</h3>
    ${j.type==='定期'?`<div class="callout w" style="margin-bottom:8px"><span>種別が「定期」の案件は、売上を定期契約で計上します。ここの金額は参考で、売上の集計には入りません。</span>${m.fixed&&!j.contractId?'<button class="btn sm" data-act="to-contract" data-id="'+id+'">定期契約を登録</button>':''}</div>`:''}
    ${m.byOrder?'<p class="small muted" style="margin:0 0 8px">原価は発行済みの発注書の金額です。</p>':''}<div class="money"><div><div class="l">売上（税抜）</div><div class="v num">${yen(m.sales)}</div></div>${can('cost.view')?`<div><div class="l">原価</div><div class="v num">${yen(m.cost)}</div></div><div><div class="l">粗利</div><div class="v num">${yen(m.gp)}</div></div><div><div class="l">粗利率</div><div class="v num">${m.sales?Math.round(m.gpr*100):0}%</div></div>`:''}</div>
    ${can('cost.view')?`<div class="form" style="margin-top:10px">${fld('見積外の原価（交通費・材料など）',`<input class="inp num" inputmode="numeric" data-jf="extraCost" value="${esc(j.extraCost)}">`)}</div>`:''}

  <section class="sec"><h3>作業日程・完了報告 <span class="num muted">${vs.length}</span><span class="sp">${['依頼受付','現地調査'].includes(j.stage||'依頼受付')?`<button class="btn sm pri" data-act="new-survey" data-id="${id}">＋ 現地調査</button> `:''}<button class="btn sm" data-act="new-visit" data-job="${id}">＋ 作業予定</button></span></h3>
    ${vs.length?`<div class="list">${vs.map(visitLi).join('')}</div>`:'<p class="empty">作業予定はまだありません。</p>'}</section>
  <div class="small muted">${esc(j.no||'')}　作成 ${esc((j.createdAt||'').slice(0,10))}　更新 ${esc((j.updatedAt||'').slice(0,10))}</div>
  <div id="delBox"><button class="btn danger sm" data-act="ask-del" data-col="jobs" data-id="${id}">この案件を削除</button></div>`};
};

/* 見積エディタ */
SHEETS.quote=(st)=>{
  const q=st.draft; const c=qcalc(q); const cv=can('cost.view');
  const lineRows=(q.lines||[]).map((l,i)=>`<tr>
    <td><input aria-label="品目" data-l="${i}" data-k="name" value="${esc(l.name)}"></td>
    <td class="n"><input aria-label="数量" class="num" inputmode="decimal" data-l="${i}" data-k="qty" value="${esc(l.qty)}"></td>
    <td class="u"><input aria-label="単位" data-l="${i}" data-k="unit" value="${esc(l.unit)}"></td>
    <td class="p"><input aria-label="単価" class="num" inputmode="numeric" data-l="${i}" data-k="price" value="${esc(l.price)}" style="text-align:right"></td>
    ${cv?`<td class="p"><input aria-label="原価" class="num" inputmode="numeric" data-l="${i}" data-k="cost" value="${esc(l.cost)}" style="text-align:right"></td>`:''}
    <td class="p r num" data-amt="${i}">${yen(num(l.qty)*num(l.price))}</td>
    <td class="x"><button class="btn ghost sm" data-act="line-del" data-i="${i}" aria-label="行を削除">✕</button></td></tr>`).join('');
  const j=get('jobs',q.jobId);
  return {title:(st.isNew?'見積を作成':'見積の編集'),
  body:`<div class="small muted">${esc(j?j.title:'')}　${esc(custName(j?.customerId))}</div>${st.isNew?'':apNote('quote',q.id)}
  <section class="sec"><div class="form">
    ${fld('件名',`<input class="inp" id="q_title" value="${esc(q.title)}">`,true)}
    ${fld('状態',`<select class="inp" id="q_status">${Q_STATUS.map(s=>opt(s,s,q.status)).join('')}</select>`)}
    ${fld('提出日',`<input class="inp" type="date" id="q_issuedAt" value="${esc(q.issuedAt)}">`)}
    ${fld('有効期限（日）',`<input class="inp num" id="q_valid" inputmode="numeric" value="${esc(q.validDays??S().quoteValidDays)}">`)}

      ${fld('協力会社に見せる報告メモ（次回の発注書に「前回の施工報告」として表示）',`<textarea class="inp" data-vf="shareNote" placeholder="例：厨房奥のフィルターは脚立2段で届く。排水口の詰まりあり、次回は高圧洗浄機を持参">${esc(v.shareNote)}</textarea>`,true)}

/* 定期契約エディタ */
SHEETS.contract=(st)=>{
  const c=st.draft, cy=c.cycle||{kind:'months',months:[]};
  const tm=ymOf(today()); const mine=all('visits').filter(v=>v.contractId===c.id).sort(by(v=>vMonth(v)+v.date));
  const upcoming=st.isNew?[]:mine.filter(v=>vMonth(v)>=tm);
  return {title:st.isNew?'定期契約を登録':'定期契約',
  body:`${st.isNew?'':apNote('price',c.id)}${(()=>{ if(st.isNew) return ''; const dbc=get('contracts',c.id)||c, t=today(); const stale=all('visits').filter(v=>v.contractId===c.id&&isOpenVisit(v)&&((dbc.active===false&&(v.date?v.date>=t:vMonth(v)>=tm))||(dbc.end&&vMonth(v)>ymOf(dbc.end)))); return stale.length?`<div class="callout w"><span>${dbc.active===false?'停止した契約':'終了日より後'}の作業予定が${stale.length}件残っています。</span><button class="btn sm" data-act="ctr-clean" data-id="${c.id}">${stale.length}件を削除</button></div>`:''; })()}
  ${(()=>{ if(!st.staffChanged) return ''; const dbc=get('contracts',c.id)||c, key=(dbc.staffIds||[]).slice().sort().join(); const diff=all('visits').filter(v=>v.contractId===c.id&&isOpenVisit(v)&&(!v.date||v.date>=today())&&(v.staffIds||[]).slice().sort().join()!==key); return diff.length?`<div class="callout"><span>標準の担当を変えました。今後の未完了の作業予定 ${diff.length}件にも反映しますか？</span><button class="btn pri sm" data-act="ctr-apply-staff" data-id="${c.id}">反映する</button></div>`:''; })()}
  ${c.needsReview?`<div class="callout w">取り込み時に周期を読み取れませんでした（元の記載：${esc(c.cycleRaw||'空欄')}）。周期を設定して保存してください。</div>`:''}
  <section class="sec"><div class="form">
    ${fld('顧客',`<select class="inp" id="c_customerId">${custOpts(c.customerId)}</select>`)}
    ${fld('現場・店舗',`<select class="inp" id="c_siteId">${siteOpts(c.customerId,c.siteId)}</select>`)}
    ${fld('作業内容',`<input class="inp" id="c_service" value="${esc(c.service)}" placeholder="例：空調フィルター清掃">`,true)}
    ${fld('単価',`<input class="inp num" id="c_unitPrice" inputmode="numeric" value="${esc(c.unitPrice)}">`)}
    ${fld('数量（台数・回数）',`<input class="inp num" id="c_qty" inputmode="decimal" value="${esc(c.qty??1)}">`)}
    ${fld('単位',`<input class="inp" id="c_unit" value="${esc(c.unit)}" placeholder="台／式／回">`)}
    ${can('cost.view')?fld('原価（単価あたり・外注費など）',`<input class="inp num" id="c_cost" inputmode="numeric" value="${esc(c.cost)}">${c.costNote?`<span class="small muted">${esc(c.costNote)}</span>`:''}`):''}
    ${fld('開始',`<input class="inp" type="date" id="c_start" value="${esc(c.start)}">`)}
    ${fld('終了（空欄＝継続）',`<input class="inp" type="date" id="c_end" value="${esc(c.end)}">`)}
    ${fld('売上の計上月',`<select class="inp" id="c_recog">${opt('same','作業した月に計上',c.recog||'same')}${opt('next','作業月の翌月に計上',c.recog||'same')}</select>`)}
    ${fld('状態',`<select class="inp" id="c_active">${opt('1','有効',c.active===false?'0':'1')}${opt('0','停止',c.active===false?'0':'1')}</select>`)}
  </div></section>
  <section class="sec"><h3>周期</h3>
    <div class="seg" role="group" style="margin-bottom:10px">${[['months','実施する月を選ぶ'],['interval','○か月ごと'],['flat','日常・月額（日程は作らない）']].map(([k,l])=>`<button data-act="cyc" data-v="${k}" aria-pressed="${cy.kind===k}">${l}</button>`).join('')}</div>
    ${cy.kind==='months'?`<div class="months">${[...Array(12)].map((_,i)=>`<label><input type="checkbox" data-cm value="${i+1}" ${(cy.months||[]).map(Number).includes(i+1)?'checked':''} hidden>${i+1}月</label>`).join('')}</div><div class="toolbar" style="margin:8px 0 0"><button class="btn sm" data-act="cyc-all">毎月</button><button class="btn sm" data-act="cyc-none">クリア</button></div>`:''}
    ${cy.kind==='interval'?`<div class="form">${fld('間隔（か月）',`<input class="inp num" id="cy_every" inputmode="numeric" value="${esc(cy.every||3)}">`)}${fld('起点の月',`<input class="inp" type="month" id="cy_anchor" value="${esc(cy.anchor||ymOf(c.start)||tm)}">`)}</div><p class="small muted">例：3年に1回の分解洗浄は「36」。</p>`:''}
    ${cy.kind==='flat'?'<p class="small muted" style="margin:0">日常清掃や常駐など、毎月同じ金額で作業予定を個別に管理しない契約です。売上は毎月計上されます。</p>':''}
  </section>
  <section class="sec"><h3>単価の改定<span class="sp"><button class="btn sm" data-act="pc-add">＋ 改定を追加</button></span></h3>
    ${(c.priceChanges||[]).length?`<div class="scroll"><table class="t lines"><thead><tr><th>適用開始月</th><th class="r">新しい単価</th>${can('cost.view')?'<th class="r">新しい原価（空欄＝変更なし）</th>':''}<th></th></tr></thead><tbody>${(c.priceChanges||[]).map((x,i)=>`<tr><td style="width:190px"><input type="month" data-pc="${i}" data-k="from" value="${esc(x.from)}" aria-label="適用開始月"></td><td class="p" style="width:150px"><input class="num" data-pc="${i}" data-k="unitPrice" value="${esc(x.unitPrice)}" style="text-align:right" aria-label="新しい単価"></td>${can('cost.view')?`<td class="p" style="width:150px"><input class="num" data-pc="${i}" data-k="cost" value="${esc(x.cost)}" style="text-align:right" aria-label="新しい原価"></td>`:''}<td class="x"><button class="btn ghost sm" data-act="pc-del" data-i="${i}" aria-label="削除">✕</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">改定の予定はありません。48期の単価改定など、決まった月から単価が変わる場合に登録します。</p>'}
    <p class="small muted" style="margin:6px 0 0">作業した月の単価で売上を計算します。完了済みの作業は、完了時の単価のまま変わりません。</p>
  </section>
  <section class="sec"><h3>標準の担当</h3><div style="display:flex;flex-wrap:wrap;gap:6px">${staffList().map(s=>`<label class="pill" style="cursor:pointer;padding:4px 10px;font-weight:400"><input type="checkbox" data-cstaff value="${s.id}" ${(c.staffIds||[]).includes(s.id)?'checked':''}> ${esc(s.name)}</label>`).join('')}</div><p class="small muted" style="margin:6px 0 0">日程を作ると、この担当が最初から入ります。</p></section>
  ${fld('備考（鍵の要否・作業条件など）',`<textarea class="inp" id="c_note">${esc(c.note)}</textarea>`,true)}
  ${st.isNew?'':`<section class="sec"><h3>作業予定 <span class="num muted">${upcoming.length}</span><span class="sp"><button class="btn sm" data-act="gen-one" data-id="${c.id}">今後12か月の日程を作成</button></span></h3>
    ${upcoming.length?`<div class="list">${upcoming.slice(0,24).map(visitLi).join('')}</div>`:'<p class="empty">まだ作業予定がありません。保存後「今後12か月の日程を作成」を押してください。</p>'}</section>
    <div id="delBox"><button class="btn danger sm" data-act="ask-del" data-col="contracts" data-id="${c.id}">この契約を削除</button></div>`}`,
  foot:`<button class="btn" data-act="close-sheet">閉じる</button><button class="btn pri" data-act="contract-save">保存</button>`};
};

/* 顧客 */
SHEETS.customer=({id})=>{
  const c=get('customers',id); if(!c) return {title:'顧客',body:'<p class="empty">削除されました。</p>'};
  const sites=all('sites').filter(s=>s.customerId===id).sort(by(siteLabel));
  const ctrs=all('contracts').filter(x=>x.customerId===id);
  const jobs=all('jobs').filter(j=>j.customerId===id).sort(by(j=>j.updatedAt||'',-1));
  const hist=all('visits').filter(v=>{const x=get('contracts',v.contractId)||get('jobs',v.jobId);return (x?x.customerId:v.customerId)===id&&v.status==='完了';}).sort(by(v=>v.date||'',-1)).slice(0,15);
  return {title:esc(c.name)+exMark(c),body:`
  <section class="sec"><h3>顧客情報<span class="sp small muted">変更は自動で保存されます</span></h3><div class="form">
    ${fld('顧客名',`<input class="inp" data-cf="name" value="${esc(c.name)}">`)}${fld('フリガナ',`<input class="inp" data-cf="kana" value="${esc(c.kana)}">`)}
    ${fld('電話',`<input class="inp" data-cf="tel" value="${esc(c.tel)}">`)}${fld('メール（見積・報告の送り先）',`<input class="inp" type="email" data-cf="email" value="${esc(c.email)}">`)}${fld('担当者（先方）',`<input class="inp" data-cf="contact" value="${esc(c.contact)}">`)}
    ${fld('略称（日常報告の本文から自動でタグを付ける名前・カンマ区切り）',`<input class="inp" data-cf="aliases" value="${esc(c.aliases)}" placeholder="例：さくら、港南店">`,true)}${fld('住所',`<input class="inp" data-cf="address" value="${esc(c.address)}">`,true)}${fld('メモ',`<textarea class="inp" data-cf="note">${esc(c.note)}</textarea>`,true)}
  </div></section>
  <section class="sec"><h3>現場・店舗 <span class="num muted">${sites.length}</span><span class="sp"><button class="btn sm" data-act="new-site" data-cust="${id}">＋ 現場</button></span></h3>
   ${sites.length?`<div class="list">${sites.map(s=>`<div class="li" data-act="site-view" data-id="${s.id}"><div class="grow">${esc(siteLabel(s))}<div class="small muted">${esc(s.address||'')}${s.keyRequired?'　鍵必要':''}</div></div><span class="small muted">定期 ${ctrs.filter(x=>x.siteId===s.id&&x.active!==false).length}</span></div>`).join('')}</div>`:'<p class="empty">現場が未登録です。</p>'}</section>
  <section class="sec"><h3>定期契約 <span class="num muted">${ctrs.length}</span><span class="sp"><button class="btn sm" data-act="new-contract" data-cust="${id}">＋ 定期契約</button></span></h3>
   ${ctrs.length?`<div class="list">${ctrs.map(x=>`<div class="li" data-act="contract" data-id="${x.id}"><div class="grow">${esc(x.service)}<div class="small muted">${esc(siteName(x.siteId))}　${esc(cycleText(x.cycle))}</div></div><span class="num">${yen(contractUnit(x))}</span></div>`).join('')}</div>`:'<p class="empty">定期契約はありません。</p>'}</section>
  <section class="sec"><h3>案件 <span class="num muted">${jobs.length}</span><span class="sp"><button class="btn sm" data-act="new-job" data-cust="${id}">＋ 案件</button></span></h3>
   ${jobs.length?`<div class="list">${jobs.map(j=>`<div class="li" data-act="job" data-id="${j.id}"><span class="pill ${STAGE_TONE[j.stage]}">${esc(j.stage)}</span><div class="grow">${esc(j.title)}<div class="small muted">${esc(siteName(j.siteId))}</div></div><span class="num">${man(jobMoney(j).sales)}</span></div>`).join('')}</div>`:'<p class="empty">案件はありません。</p>'}</section>
  <section class="sec"><h3>作業履歴（直近）</h3>${hist.length?`<div class="list">${hist.map(visitLi).join('')}</div>`:'<p class="empty">完了した作業はまだありません。</p>'}</section>
  <div id="delBox"><button class="btn danger sm" data-act="ask-del" data-col="customers" data-id="${id}">この顧客を削除</button></div>`};
};
SHEETS.siteView=({id})=>{
  const s=get('sites',id); if(!s) return {title:'現場',body:'<p class="empty">削除されました。</p>'};
  const t=today(), tm=ymOf(t);
  const ks=all('contracts').filter(x=>x.siteId===id).sort(by(x=>(x.active===false?'1':'0')+(x.service||'')));
  const js=all('jobs').filter(j=>j.siteId===id).sort(by(j=>j.updatedAt||'',-1));
  const spot=js.filter(j=>j.type!=='定期'), regJobs=js.filter(j=>j.type==='定期');
  const vs=siteVisits(id);
  const up=vs.filter(v=>isOpenVisit(v)&&(v.date?v.date>=addDays(t,-30):vMonth(v)>=ymAdd(tm,-1))).sort(by(v=>v.date||vMonth(v)+'-99')).slice(0,12);
  const done=vs.filter(v=>v.status==='完了').sort(by(v=>v.date||'',-1)).slice(0,10);
  const yr=siteYear(id,tm);
  const jobRow=j=>`<div class="li" data-act="job" data-id="${j.id}"><span class="pill ${STAGE_TONE[j.stage]}">${esc(j.stage)}</span><div class="grow">${esc(j.title)}<div class="small muted">${esc(j.no||'')}　${j.workDate?'作業 '+jd(j.workDate):j.receivedAt?'受付 '+esc(j.receivedAt):''}</div></div><span class="num">${man(jobMoney(j).sales)}</span></div>`;
  return {title:esc(siteLabel(s)),head:`<button class="btn sm" data-act="site" data-id="${id}">現場情報を編集</button>`,
  body:`<div class="small muted">${esc(custName(s.customerId))}${s.storeNo?'　店番 '+esc(s.storeNo):''}${s.address?'　'+esc(s.address):''}${s.keyRequired?'　<span class="pill w">鍵必要</span>':''}</div>
  ${s.note?`<div class="callout w">${esc(s.note)}</div>`:''}
  <div class="money"><div><div class="l">定期契約</div><div class="v num">${ks.filter(x=>x.active!==false).length}件</div></div><div><div class="l">今後12か月の定期売上</div><div class="v num">${man(yr)}</div></div><div><div class="l">スポット案件</div><div class="v num">${spot.length}件</div></div><div><div class="l">スポット売上（受注済み）</div><div class="v num">${man(spot.filter(j=>['受注','施工','完了'].includes(j.stage)).reduce((a,j)=>a+jobMoney(j).sales,0))}</div></div></div>
  <section class="sec"><h3>定期契約 <span class="num muted">${ks.length}</span><span class="sp"><button class="btn sm" data-act="new-contract" data-cust="${s.customerId}" data-site="${id}">＋ 定期契約</button></span></h3>
    ${ks.length?`<div class="list">${ks.map(x=>`<div class="li" data-act="contract" data-id="${x.id}" style="${x.active===false?'opacity:.55':''}"><div class="grow">${esc(x.service)}${x.active===false?' <span class="pill r">停止</span>':''}${x.needsReview?' <span class="pill w">周期を確認</span>':''}<div class="small muted">${esc(cycleText(x.cycle))}　${esc((x.staffIds||[]).map(staffName).join('・'))}</div></div><span class="num">${yen(contractUnit(x))}${x.cycle?.kind==='flat'?'/月':'/回'}</span></div>`).join('')}</div>`:'<p class="empty">定期契約はありません。</p>'}</section>
  <section class="sec"><h3>スポット案件 <span class="num muted">${spot.length}</span><span class="sp"><button class="btn sm" data-act="new-job" data-cust="${s.customerId}" data-site="${id}">＋ 案件</button></span></h3>
    ${spot.length?`<div class="list">${spot.map(jobRow).join('')}</div>`:'<p class="empty">スポット案件はありません。</p>'}
    ${regJobs.length?`<h3 style="margin:12px 0 6px">定期関連の案件 <span class="num muted">${regJobs.length}</span></h3><div class="list">${regJobs.map(jobRow).join('')}</div>`:''}</section>
  <section class="sec"><h3>今後の作業 <span class="num muted">${up.length}</span></h3>${up.length?`<div class="list">${up.map(visitLi).join('')}</div>`:'<p class="empty">予定はありません。</p>'}</section>
  <section class="sec"><h3>作業履歴（直近） <span class="num muted">${done.length}</span></h3>${done.length?`<div class="list">${done.map(visitLi).join('')}</div>`:'<p class="empty">完了した作業はまだありません。</p>'}</section>`};
};

function colName(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
const normH=h=>String(h??'').replace(/[\s　\n\r]/g,'').replace(/[（(].*?[)）]/g,'');
function detectHeader(rows){
  let best=0,bi=0; const kws=IMPORT_FIELDS.flatMap(f=>f[2]);
  rows.slice(0,25).forEach((r,i)=>{const sc=r.filter(c=>{const n=normH(c);return n&&kws.some(k=>n===k||n.includes(k));}).length; if(sc>best){best=sc;bi=i;}});
  return bi;
}
function autoMap(headers){
  const map={}; const used=new Set();
  IMPORT_FIELDS.forEach(([k,,kws])=>{
    for(const kw of kws){ const i=headers.findIndex((h,ix)=>!used.has(ix)&&normH(h)===kw); if(i>=0){map[k]=String(i);used.add(i);return;} }
    for(const kw of kws){ const i=headers.findIndex((h,ix)=>!used.has(ix)&&normH(h).includes(kw)&&!/^\d{1,2}月/.test(normH(h))); if(i>=0){map[k]=String(i);used.add(i);return;} }
  });
  return map;
}
function findMonthCols(headers){
  const seen=new Set(), out=[];
  headers.forEach((h,i)=>{const m=normH(h).match(/^(\d{1,2})月(?!.*(数量|完了|台数|金額))/); if(m){const mo=+m[1]; if(mo>=1&&mo<=12&&!seen.has(mo)){seen.add(mo);out.push({mo,i});}}});
  return out;
}
function setupSheet(st){
  const ws=st.wb.Sheets[st.sheet]; st.rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});

function parseCycle(text){

  m=t.match(/年(\d+)回/); if(m&&+m[1]>0) return {kind:'interval',every:Math.max(1,Math.round(12/+m[1]))};

      await put('porders',k,rec);
    }

    for(const p of all('porders')){
      if(p.cancelled) continue;
      if(p.kind==='contract'){ if(!cg.has(p.id)&&p.ym>=winFrom&&p.ym<=winTo&&!p.done) await put('porders',p.id,{...p,cancelled:true}); continue; }
      if(!want.has(p.id)) await put('porders',p.id,{...p,cancelled:true});
    }
  } finally { poRunning=false; if(poAgain){ poAgain=false; setTimeout(syncPartnerOrders,30); } }
}

/* =========================================================
   社内の権限（5段階）と承認の流れ
   1 管理者 / 2 責任者（上長） / 3 営業・事務 / 4 現場スタッフ / 5 パート・アルバイト（＋協力会社は別枠）
   人ごとに「追加の権限」「承認者」「不在時の代理」を設定できる。
   試作では「利用者」の切り替えで本人を決める。本番はログインした人になる。
   ========================================================= */
const LV={admin:1,lead:2,manager:3,staff:4,part:5,kiosk:8,partner:9};
const DEFAULT_MODE={admin:'full',lead:'full',manager:'full',staff:'simple',part:'time',partner:'report',kiosk:'time'};
const EXTRA_L={'cost.view':'原価・粗利を見る','visit.assign':'日程の差配・定期契約の編集','approve':'承認する（責任者と同じ）','price.edit':'価格表・見積テンプレートの変更','staff.edit':'利用者の追加・編集','time.close':'勤怠の締め','res.edit':'予約できるもの・予定の種別の設定'};
const roleOf=s=>s?.kind==='協力会社'?'partner':(s?.role&&LV[s.role]?s.role:'staff');

function approverFor(rid){
  const s=get('staff',rid)||{}; let a=get('staff',s.approverId);
  if(a&&(a.away||a.inactive)) a=get('staff',s.subApproverId)||null;
  return a&&!a.away&&!a.inactive?a.id:'';
}
function approverLabel(rid){ const a=approverFor(rid); if(a) return staffName(a); const s=get('staff',rid)||{}; return s.approverId?'責任者（承認者が不在・代理なし）':'責任者・管理者'; }
function canApproveFor(rid,me,ap){ me=me||SHELL.meId(); const m=get('staff',me); if(!m||me===rid) return false; return canApproveRole(m,rid,ap); }
function canApproveRole(m,rid,ap){
  const r=roleOf(m); if(r==='admin') return true;
  const a=approverFor(rid); if(a){ if(a===m.id) return true; if(!(ap&&apOverdue(ap))) return false; const s=get('staff',rid)||{}; return r==='lead'||(m.extra||[]).includes('approve')||s.subApproverId===m.id; }
  return r==='lead'||(m.extra||[]).includes('approve');
}
function needAp(kind,o={}){
  const st=S(), s=meStaff(), r=roleOf(s);
  if(!s||r==='admin'||r==='lead'||(s.extra||[]).includes('approve')) return false;
  if(kind==='quote'){ if(!st.apQuote) return false; if(o.discount) return true; if(num(o.amount)>num(st.apQuoteMax)) return true; return num(st.apQuoteGpr)>0&&o.gpr!=null&&o.gpr*100<num(st.apQuoteGpr); }
  if(kind==='order') return !!st.apOrder&&num(o.amount)>num(st.apOrderMax);
  if(kind==='stop') return !!st.apStop;
  if(kind==='price') return !!st.apPrice;
  return false;
}

async function decideAp(id,ok,comment){

  await put('approvals',id,{...a,status:ok?'承認':'差戻し',decidedBy:SHELL.meId(),decidedAt:new Date().toISOString(),comment:comment||''});
  toast(ok?'承認しました':'差し戻しました');
}

const FLOW_ORDER=['依頼受付','現地調査','見積','受注','施工','完了'];
const flowAuto=()=>S().flowAuto!==false;
const nowIso=()=>new Date().toISOString();

function undoToast(m,jid,from){

  t.innerHTML=`${esc(m)} <button class="btn sm" data-act="stage-undo" data-id="${esc(jid)}" data-v="${esc(from)}" style="margin-left:8px">元に戻す</button>`;

function stageCh(j,to,why){ const at=nowIso(); const ch={stage:to,stageAt:at,stageLog:[...(j.stageLog||[]),{from:j.stage||'依頼受付',to,at,by:SHELL.meId(),why}].slice(-30)};
  if(to==='完了'&&!j.completedAt) ch.completedAt=today(); ch.closedAt=['完了','失注'].includes(to)?today():''; return ch; }
// 段階を進める。auto=true のときは「前へ進む」動きだけ・設定でオフなら何もしない
async function moveStage(jid,to,why,auto=true){
  const j=get('jobs',jid); if(!j) return false; const from=j.stage||'依頼受付';
  if(from===to) return false;
  if(auto){ if(!flowAuto()||['完了','失注'].includes(from)) return false; if(FLOW_ORDER.indexOf(to)<=FLOW_ORDER.indexOf(from)) return false; }
  await patch('jobs',jid,stageCh(j,to,why));
  undoToast(`「${j.title}」を「${to}」に移しました（${why}）`,jid,from);
  return true;
}

function nextStep(j){
  const st=S(), stg=j.stage||'依頼受付', t=today();
  if(['完了','失注'].includes(stg)) return null;
  const qs=jobQuotes(j.id), q=qs[qs.length-1], os=jobOrders(j.id).filter(o=>o.status!=='中止'), vs=all('visits').filter(v=>v.jobId===j.id&&v.status!=='中止');
  const intake=num(st.flowIntakeDays)||3, draft=num(st.flowDraftDays)||3, won=num(st.flowWonDays)||3, fol=num(st.followDays)||7;
  const age=daysSince(stageAgeFrom(j)), unsent=os.find(orderUnsent);
  const nextV=vs.filter(v=>v.date&&v.date>=t&&v.status!=='完了').sort(by(v=>v.date))[0];
  if(unsent) return {txt:'発注書がまだ担当者に送られていません',stale:true,why:'発注書未送付',btns:[['osend','送る',unsent.id]]};
  if(stg==='依頼受付'||stg==='現地調査'){
    if(nextV) return {txt:`${stg==='現地調査'?'現地調査':'予定'} ${jd(nextV.date)}`,stale:false};
    if(q) return {txt:'見積を作成中',stale:false};
    return {txt:stg==='現地調査'?'現地調査が済んだら見積を作る':'現地調査の予定か見積を入れる',stale:age>=intake,why:`${age}日動きなし`,btns:stg==='現地調査'?[['new-quote','見積を作る',j.id]]:[['new-survey','現地調査',j.id],['new-quote','見積を作る',j.id]]};
  }
  if(stg==='見積'){
    if(!q) return {txt:'見積を作る',stale:age>=draft,why:`${age}日動きなし`,btns:[['new-quote','見積を作る',j.id]]};
    if(q.status==='作成中'){ const a=daysSince(q.updatedAt||q.createdAt); return {txt:'見積がまだ提出されていません',stale:a>=draft,why:`見積未提出 ${a}日`,btns:[['qsend','お客様に送る',q.id]]}; }

    if(q.status==='承認待ち') return {txt:'見積の承認待ち',stale:false};
    if(q.status==='提出済'){ const a=daysSince(q.issuedAt||q.updatedAt), c=daysSince(j.lastContact||'2000-01-01'); return {txt:`結果待ち（提出から${a}日）`,stale:a>=fol&&c>=fol,why:`結果待ち ${a}日`,btns:[['qa-won','受注',q.id],['qa-lost','失注',j.id]]}; }
    if(q.status==='失注') return {txt:'見積が失注になっています',stale:true,why:'案件の失注が未入力',btns:[['qa-lost','失注にする',j.id]]};
    return {txt:'受注の処理を',stale:false,btns:[['qa-won','受注',q.id]]};
  }
  if(stg==='受注'){
    if(!os.length&&!vs.length) return {txt:'発注書か作業予定を入れる',stale:age>=won,why:`発注・予定なし ${age}日`,btns:[['new-order','発注書',j.id],['new-visit-job','作業予定',j.id]]};
    return {txt:nextV?`作業 ${jd(nextV.date)}`:'作業日待ち',stale:false};
  }
  if(stg==='施工'){
    if(jobAllDone(j)) return {txt:'作業がすべて完了しました',stale:true,why:'完了の入力待ち',btns:[['qa-done','完了にする',j.id]]};
    const late=vs.find(isLate); if(late) return {txt:`作業日（${jd(late.date)}）を過ぎて未完了`,stale:true,why:'作業日超過'};
    return {txt:nextV?`次の作業 ${jd(nextV.date)}`:'作業予定を入れる',stale:!vs.length&&age>=won,why:'作業予定なし'};
  }
  return null;
}

async function visitChangeNotice(old,id,ch){
  if(!isOfficeMe()) return;
  const v=get('visits',id); if(!v||['完了','中止'].includes(v.status)) return;
  const t=today(); if(!((v.date&&v.date>=t)||(old.date&&old.date>=t))) return;
  const sameIds=(a,b)=>JSON.stringify([...(a||[])].sort())===JSON.stringify([...(b||[])].sort());
  const diff=[];
  if((old.date||'')!==(v.date||'')) diff.push(`日付 ${old.date?jd(old.date):'未定'} → ${v.date?jd(v.date):'未定'}`);
  if((old.start||'')!==(v.start||'')||(old.end||'')!==(v.end||'')) diff.push(`時間 ${old.start||old.end?`${old.start||''}〜${old.end||''}`:'未定'} → ${v.start||v.end?`${v.start||''}〜${v.end||''}`:'未定'}`);
  if(!sameIds(old.staffIds,v.staffIds)) diff.push(`担当 ${(old.staffIds||[]).map(staffName).join('・')||'未定'} → ${(v.staffIds||[]).map(staffName).join('・')||'未定'}`);
  if(!diff.length) return;

  if(!to.length) return;
  const added=to.filter(s=>!(old.staffIds||[]).includes(s));

}

let pdfLibP=null;
function loadPdfLib(){ if(window.jspdf&&window.html2canvas) return Promise.resolve(); if(pdfLibP) return pdfLibP;
  pdfLibP=new Promise((ok,ng)=>{ const s=document.createElement('script'); s.src='pdflib.js'; s.onload=()=>ok(); s.onerror=()=>{ pdfLibP=null; ng(new Error('PDFの部品を読み込めませんでした')); }; document.head.appendChild(s); }); return pdfLibP; }

  const box=document.createElement('div'); box.style.cssText='position:absolute;left:-10000px;top:0;width:760px;padding:36px;background:#fff;color:#111;font-family:"Yu Gothic","Hiragino Sans","Noto Sans JP",sans-serif;font-size:12px;line-height:1.6';

function partnerRows(pid){

  makeDemo:()=>makeDemo(), putMany:(items,p)=>putMany(items,p),
  addVisit:d=>put('visits',null,d),
  flowMine:me=>flowMine(me).map(x=>({id:x.j.id,title:x.j.title,why:x.n.why||x.n.txt})),
  noticesFor:me=>noticesFor(me).map(v=>({id:v.id,title:visitTitle(v),date:v.date,start:v.start,end:v.end,text:v.notice.text,from:v.notice.byName||''})),
  ackNotice:id=>ackNotice(id),
  openJob(id){ if(!get('jobs',id)) return toast('案件が見つかりません'); openSheet({kind:'job',id}); },
  canApproveFor:(rid,me)=>canApproveFor(rid,me),
  apCount:me=>apMine(me).length,
  openApprovals(){ openSheet({kind:'approvals'}); },
  poIssues:()=>poIssues(),
  openOrder(id){ const o=get('orders',id); if(!o) return toast('発注書が見つかりません'); const d=JSON.parse(JSON.stringify(o)); d.schedule=orderRows(d).map(r=>({...r})); openSheet({kind:'order',live:false,draft:d}); },
  openMaster(col,id){
    if(col==='customers'){ if(id) openSheet({kind:'customer',id}); else put('customers',null,{name:'新しい顧客'}).then(nid=>{ openSheet({kind:'customer',id:nid}); setTimeout(()=>{const i=ROOT.querySelector('[data-cf="name"]');i&&i.select();},50); }); }
    else if(col==='sites'){ if(id) openSheet({kind:'site',live:false,draft:{...get('sites',id)}}); else openSheet({kind:'site',isNew:true,live:false,draft:{id:uid(),customerId:''}}); }
    else if(col==='jobs'){ if(id) openSheet({kind:'job',id}); else openSheet({kind:'newJob',live:false,draft:{customerId:'',siteId:'',type:'スポット',ownerId:''}}); }
  },
  isOffice:()=>isOfficeMe(),
  quotePdfInfo:async (qid,b64)=>{ const f=await quotePdf(get('quotes',qid)); if(b64){ const u=new Uint8Array(await f.arrayBuffer()); let s=''; u.forEach(c=>s+=String.fromCharCode(c)); return btoa(s); } return {name:f.name,size:f.size,type:f.type}; },
  anyQuote:()=>all('quotes')[0]?.id||'',
  apResults:me=>apApproved(me).length+apReturned(me).length,
  poRepOk:(p,k)=>poRepOk(p,k),
  visitInfo:id=>visitInfo(id),
  visitDone:(id,note)=>visitDoneField(id,note),
  visitAttach:(id,f)=>visitAttachField(id,f),
  visitPatch:(id,ch)=>patch('visits',id,ch),
  resMirror:id=>resMirror(id),
  setMtab:t=>{ VS.mtab=t; shellRoute=null; },
  rerender:()=>requestRender(),
  toast:m=>toast(m),
};

boot();

})();

</script>
<script>SHELL.start();</script>
</body></html>
