<style>
/* ===== 共通（シェル） ===== */
:root{--bg:#f1f3f6; --surface:#ffffff; --surface-2:#e8ebf1; --line:#d3d8e2; --fg:#1a2130; --muted:#5a6476;
  --accent:#2b4aad; --accent-fg:#ffffff; --accent-soft:#e2e8f8;
  --warn:#a35f00; --warn-soft:#fbeed6; --ok:#1c7148; --ok-soft:#ddf0e5; --bad:#b0281f; --bad-soft:#f8e0dd;
  --shadow:0 10px 30px rgba(20,30,60,.16);
  --p0:#2f8f5b;--p0s:#e1f2e8;--p1:#2b6fd6;--p1s:#e2ecfb;--p2:#c06a12;--p2s:#fbecd9;--p3:#8a4fc7;--p3s:#f0e6fa;
  --p4:#c23d6b;--p4s:#fbe3ec;--p5:#1a8c94;--p5s:#ddf2f3;--p6:#8a7a12;--p6s:#f5f0d4;--p7:#4b5bd6;--p7s:#e4e7fb;--pn:#7a8291;--pns:#eceef1;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11141b; --surface:#191e28; --surface-2:#222836; --line:#323a4c; --fg:#e5e8ef; --muted:#9aa3b6;
  --accent:#8aa2ff; --accent-fg:#0f1530; --accent-soft:#232e57;
  --warn:#f0b65a; --warn-soft:#3a2b12; --ok:#6fd09d; --ok-soft:#16301f; --bad:#ff8c82; --bad-soft:#3d1815;
  --shadow:0 10px 30px rgba(0,0,0,.5); --p0:#5fd08f;--p0s:#173523;--p1:#78a9ff;--p1s:#172a4a;--p2:#f0a35a;--p2s:#3a2711;--p3:#c49bf2;--p3s:#2e2140;
  --p4:#f28fb2;--p4s:#3d1a27;--p5:#5fd3d9;--p5s:#143436;--p6:#e0cd5c;--p6s:#35300f;--p7:#9aa6ff;--p7s:#21264a;--pn:#a3abb8;--pns:#262b35; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11141b; --surface:#191e28; --surface-2:#222836; --line:#323a4c; --fg:#e5e8ef; --muted:#9aa3b6;
  --accent:#8aa2ff; --accent-fg:#0f1530; --accent-soft:#232e57;
  --warn:#f0b65a; --warn-soft:#3a2b12; --ok:#6fd09d; --ok-soft:#16301f; --bad:#ff8c82; --bad-soft:#3d1815;
  --shadow:0 10px 30px rgba(0,0,0,.5); --p0:#5fd08f;--p0s:#173523;--p1:#78a9ff;--p1s:#172a4a;--p2:#f0a35a;--p2s:#3a2711;--p3:#c49bf2;--p3s:#2e2140;
  --p4:#f28fb2;--p4s:#3d1a27;--p5:#5fd3d9;--p5s:#143436;--p6:#e0cd5c;--p6s:#35300f;--p7:#9aa6ff;--p7s:#21264a;--pn:#a3abb8;--pns:#262b35; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;padding:2px 10px 14px;display:flex;align-items:baseline;gap:6px}
.brand small{font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted)}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;cursor:pointer;color:var(--muted)}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .badge{margin-left:auto}
.nav .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:8px 10px}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{font-family:var(--f-num);font-size:11px;min-width:20px;text-align:center;padding:0 6px;border-radius:999px;background:var(--warn);color:var(--surface);font-weight:500}
.tabbar{display:none}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}
.nav{display:none}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:8px 0 6px;color:var(--muted);position:relative}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabbar .badge{position:absolute;top:3px;left:calc(50% + 6px);font-size:9.5px;min-width:16px;padding:0 4px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* シェル独自 */
html,body{margin:0;padding:0}
.mod{min-width:0}
.snav{overflow-y:auto;gap:2px}
.snav .grp{font-size:11px;color:var(--muted);padding:12px 10px 3px;letter-spacing:.04em}
.snav .who{display:flex;flex-direction:column;gap:3px;padding:0 6px 6px;font-size:11px;color:var(--muted)}
.sinp{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 8px;font-size:13px}
.shell-banner:empty{display:none}
.shell-banner{padding:14px max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px))}
.sbanner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sbanner.a{background:var(--accent-soft);color:var(--accent)}
.sbanner span{font-size:12px;opacity:.85}
.btn-s{border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);padding:5px 12px;font-weight:700;cursor:pointer}
.sscrim{position:fixed;inset:0;z-index:44}

@media (max-width:900px){ .shell-banner{padding:12px 16px 0} }
.smore{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:45;display:flex;flex-direction:column;padding:6px;min-width:200px;max-height:calc(100vh - 100px);overflow:auto}
.smore button{border:0;background:none;padding:10px 12px;text-align:left;border-radius:8px;display:flex;gap:10px;align-items:center;cursor:pointer}
.smore button:hover{background:var(--surface-2)}
.smore .badge{margin-left:6px}
button,input,select,textarea{font:inherit;color:inherit}
/* カレンダー枠の「他N件」と一覧 */
@media (min-width:901px){ #S .mcal .cd[data-fit]{height:112px;overflow:hidden} }
@media (min-width:701px){ #G .mcal .cd[data-fit]{height:118px;overflow:hidden} #G .mcal .cd[data-fit] .cevs{flex:1 1 auto;min-height:0;overflow:hidden} }
#S [data-fit] [data-fitem],#G [data-fit] [data-fitem]{flex:none}
#S .fitl,#G .fitl{max-height:168px;overflow:hidden}
#G .board.month .fitl{max-height:66px}
#S [data-fit][data-over],#G [data-fit][data-over]{cursor:pointer}
#S .fitmore,#G .fitmore{flex:none;display:block;width:100%;border:0;background:none;color:var(--accent);font-size:11px;font-weight:700;text-align:left;padding:1px 5px;cursor:pointer;line-height:1.4}
#S .fitmore:hover,#G .fitmore:hover{text-decoration:underline}
.fitscrim{position:fixed;inset:0;z-index:60;background:rgba(15,20,35,.12)}
.fitpop{position:fixed;z-index:61;width:320px;max-height:min(70vh,560px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.fitpop.mob{left:0;right:0;bottom:0;width:auto;border-radius:14px 14px 0 0;max-height:75vh;padding-bottom:env(safe-area-inset-bottom,0px)}
.fph{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fph b{font-family:var(--f-display);font-size:15px}
.fph span{font-size:12px;color:var(--muted)}
.fph .fpn{margin-right:auto}
.fph .btn-s{font-size:12px;padding:4px 10px}
.fpx{border:0;background:none;font-size:18px;line-height:1;padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--muted)}
.fpx:hover{background:var(--surface-2)}
.fpb{overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
#S .fitpop .cev,#G .fitpop .cev,#G .fitpop .chip{display:block!important;white-space:normal;margin:0;font-size:12.5px;padding:5px 8px}
/* ログイン（本番） */
#sb-login{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.sbl{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.sbl-brand{font-family:var(--f-display);font-weight:700;font-size:22px;display:flex;flex-direction:column}
.sbl-brand small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}
.sbl h1{font-size:18px;margin:4px 0 0}
.sbl label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.sbl input{border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;background:var(--surface);color:var(--fg)}
.sbl-pri{border:0;border-radius:9px;background:var(--accent);color:var(--accent-fg);padding:11px;font-weight:700;font-size:15px;cursor:pointer}
.sbl-sub{display:flex;flex-direction:column;gap:6px}
.sbl-sub button,.sbl-link{border:0;background:none;color:var(--accent);text-align:left;padding:2px 0;cursor:pointer;font-size:13px}
.sbl-msg{margin:0;font-size:13px;background:var(--accent-soft);color:var(--accent);padding:8px 10px;border-radius:8px}
.sbl-note{margin:0;font-size:12px;color:var(--muted)}
.sb-toast{position:fixed;left:50%;transform:translateX(-50%);top:16px;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:9px;z-index:300;font-size:13px}
.snav .who b{font-size:14px;color:var(--fg)}
body.sb-nonadmin #S [data-chg="me"]{display:none}
#sb-login[hidden]{display:none!important}
/* 案件ボード：次にやること */
#G .flow{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:5px;margin-top:2px}
#G .flow.stale{color:var(--warn);font-weight:700}
#G .flow .btn{padding:1px 8px;font-size:11px;font-weight:400}
#G .sheet .flow{border-top:0;font-size:13px;padding:6px 8px;background:var(--surface-2);border-radius:8px}
#G .toast .btn{background:var(--bg);color:var(--fg)}
/* ===== 共用端末（打刻専用） ===== */
#kiosk{position:fixed;inset:0;z-index:9999;background:var(--bg,#f6f5f2);overflow:auto;font-size:18px}
#kiosk[hidden]{display:none!important}
body.kiosk-on .app,body.kiosk-on #shell-tab{display:none}
#kiosk .kq{max-width:960px;margin:0 auto;padding:20px 16px 80px}
#kiosk .kq-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;font-size:22px}
#kiosk .kq-clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:30px}
#kiosk .kq-msg{background:#e7f3ea;border:1px solid #9cc9a6;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-weight:700}
#kiosk .kq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
#kiosk .kq-person{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:16px;border-radius:12px;border:1px solid #d8d4cc;background:#fff;font:inherit;cursor:pointer;text-align:left}
#kiosk .kq-person b{font-size:20px}
#kiosk .kq-person small{font-size:14px;color:#6b665e}
#kiosk .kq-person.work{border-color:#2f7d4a;box-shadow:inset 4px 0 0 #2f7d4a}
#kiosk .kq-person.done{opacity:.6}
#kiosk .kq-pad{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#kiosk .kq-who{font-size:22px;text-align:center}
#kiosk .kq-pin{height:56px;border:1px solid #d8d4cc;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;letter-spacing:8px}
#kiosk .kq-pin span{font-size:16px;letter-spacing:0;color:#8a857c}
#kiosk .kq-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#kiosk .kq-keys button{height:64px;font-size:26px;border-radius:12px;border:1px solid #d8d4cc;background:#fff;cursor:pointer}
#kiosk .kq-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#kiosk .kq-acts button{height:72px;font-size:24px;font-weight:700;border-radius:12px;border:0;color:#fff;cursor:pointer}
#kiosk .kq-in{background:#2f7d4a}#kiosk .kq-out{background:#9a4b2b}
#kiosk .kq-acts button:disabled{background:#c9c5bd;cursor:default}
#kiosk .kq-back{background:none;border:0;color:#6b665e;text-decoration:underline;font:inherit;cursor:pointer}
#kiosk .kq-empty{color:#6b665e}
#kiosk .kq-foot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 16px;background:rgba(246,245,242,.95);border-top:1px solid #d8d4cc;font-size:13px;color:#6b665e}
#kiosk .kq-foot button{margin-left:auto;background:none;border:1px solid #d8d4cc;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}

  --accent:#8aa2ff; --accent-fg:#0f1530; --accent-soft:#232e57;
  --warn:#f0b65a; --warn-soft:#3a2b12; --ok:#6fd09d; --ok-soft:#16301f; --bad:#ff8c82; --bad-soft:#3d1815;
  --shadow:0 10px 30px rgba(0,0,0,.5); --p0:#5fd08f;--p0s:#173523;--p1:#78a9ff;--p1s:#172a4a;--p2:#f0a35a;--p2s:#3a2711;--p3:#c49bf2;--p3s:#2e2140;
  --p4:#f28fb2;--p4s:#3d1a27;--p5:#5fd3d9;--p5s:#143436;--p6:#e0cd5c;--p6s:#35300f;--p7:#9aa6ff;--p7s:#21264a;--pn:#a3abb8;--pns:#262b35; color-scheme:dark}}

  async function kioskClick(e){

      KQ.busy=true; kioskRender();
      try{ const r=await KQ.api.punch(KQ.sel,KQ.pin,k); KQ.msg=`${r.name}さん　${k==='in'?'出勤':'退勤'} ${r.hm}　を記録しました`; KQ.sel=''; }

  function fakeDb(){
    const store={}, subs={}, q=new Set();
    const col=c=>(store[c]??=new Map());
    const snap=c=>({docs:[...col(c)].map(([id,d])=>({id,data:()=>structuredClone(d)}))});
    const notify=c=>{ if(q.has(c)) return; q.add(c); setTimeout(()=>{ q.delete(c); const s=snap(c); (subs[c]||[]).forEach(f=>f(s)); },0); };
    return {collection(c){ return {
      onSnapshot(f){ (subs[c]??=[]).push(f); setTimeout(()=>f(snap(c)),0); return ()=>{ subs[c]=subs[c].filter(x=>x!==f); }; },
      doc(id){ return {
        set(d){ col(c).set(id,structuredClone(d)); notify(c); return Promise.resolve(); },
        delete(){ col(c).delete(id); notify(c); return Promise.resolve(); },
      }; },
    }; }};
  }

  let seeding=false, autoSeeded=false;
  async function seed(){
    if(SB){ G_API.toast('本番の保存先にはサンプルデータを入れられません'); return; }
    if(seeding) return; seeding=true;
    try{
      G_API.toast('サンプルデータを入れています…');
      const g=G_API.makeDemo(), s=S_API.makeSample();
      const MAP={smp_s1:'stf_a',smp_s2:'stf_b',smp_s3:'stf_c',smp_s4:'stf_d',smp_p1:'stf_e',smp_p2:'stf_f',

      const sm=JSON.parse(JSON.stringify(s).replace(/smp_[a-z0-9]+/g,m=>MAP[m]||m));
      const FIELDS={staff:['mode','color','aliases','shift','shiftSites','skills','cond'],customers:['aliases'],sites:['aliases'],jobs:[]};
      for(const [c,fields] of Object.entries(FIELDS)){
        g[c]=g[c]||[];
        for(const r of sm[c]||[]){
          const t=g[c].find(x=>x.id===r.id);
          if(t){ fields.forEach(f=>{ if(r[f]!=null&&r[f]!=='') t[f]=r[f]; }); }
          else if(c==='jobs') g[c].push({...r,stage:'受注',type:'スポット',ownerId:'stf_a',source:'既存顧客',no:'J-'+r.id.slice(-2).toUpperCase(),receivedAt:todayStr(),demo:true});
          else g[c].push({...r,...(c==='staff'&&r.role==='パート'?{role:'part'}:{}),demo:true});
        }
        delete sm[c];
      }
      // 顧客の現場での「作業」の予定は作業予定（日程・差配）へ
      const t=todayStr(), evMap={};

function onWriteErr(e){

}
function put0(col,id,data){

}

// タグ辞書（自動検出用）
function tagDict(){
  const out=[];
  const addN=(k,id,names)=>names.filter(n=>n&&n.length>=2).forEach(n=>out.push({k,id,n}));
  all('customers').forEach(c=>addN('customer',c.id,[c.name,...String(c.aliases||'').split(/[,、，\s]+/)]));
  all('sites').forEach(s=>addN('site',s.id,[s.name,...String(s.aliases||'').split(/[,、，\s]+/)]));
  all('jobs').forEach(j=>addN('job',j.id,[j.title]));
  staffList().forEach(s=>addN(s.kind==='協力会社'?'partner':'staff',s.id,[s.name,...String(s.aliases||'').split(/[,、，\s]+/)]));
  return out.sort((a,b)=>b.n.length-a.n.length);
}
function detectTags(text){
  const found=[]; const seen=new Set(); let t=String(text||'');
  for(const d of tagDict()){ if(t.includes(d.n)){ const key=d.k+':'+d.id; if(!seen.has(key)){seen.add(key);found.push({k:d.k,id:d.id});} t=t.split(d.n).join(' '); } }
  return found;
}

function evChip(e,showWho){

function monthCal(ids){
  const m=ymOf(VS.calDate); const first=parseD(m+'-01'); const start=addDays(m+'-01',-first.getDay());

function calFilter(rows,days){ if(rows.length<=1) return rows; const q=F('cal_q'), fs=F('cal_site',''), fh=F('cal_has'), fk=F('cal_kind');

function calBar(rows,allRows){ if(allRows.length<=1) return ''; return fBar([fSearch('cal_q'),fSel('cal_site',siteOptsF(),'現場',''),fSel('cal_kind',[['','区分：すべて'],...Object.entries(KIND_L)],'区分'),fTgl('cal_has','予定がある人だけ')],rows.length,allRows.length,['cal_q','cal_site','cal_kind','cal_has']); }

/* ================= 日常報告 ================= */

}
/* 報告の期間 */
const wkStart=d=>{ const x=parseD(d); return addDays(d,-((x.getDay()+6)%7)); };
const monthEnd=ym=>addDays(ymAdd(ym,1)+'-01',-1);
const md=s=>{ const d=parseD(s); return `${d.getMonth()+1}/${d.getDate()}`; };
function rpAt(u,d){ d=d||today();
  if(u==='d') return {u,from:d,to:d};
  if(u==='w'){ const f=wkStart(d); return {u,from:f,to:addDays(f,6)}; }
  if(u==='m'){ const ym=ymOf(d); return {u,from:ym+'-01',to:monthEnd(ym)}; }
  if(u==='all') return {u,from:'',to:''};
  return {u:'c',from:addDays(d,-6),to:d};
}
const rp=()=>VS.rp||(VS.rp=rpAt('m'));
function rpShift(n){ const r=rp();
  if(r.u==='d') VS.rp=rpAt('d',addDays(r.from,n));
  else if(r.u==='w') VS.rp=rpAt('w',addDays(r.from,7*n));
  else if(r.u==='m') VS.rp=rpAt('m',ymAdd(ymOf(r.from),n)+'-01');
}
function rpLabel(r){
  if(r.u==='d') return jd(r.from)+(r.from===today()?' 今日':'');
  if(r.u==='w') return `${md(r.from)}〜${md(r.to)}`+(r.from===wkStart(today())?' 今週':'');
  if(r.u==='m') return ymLabel(ymOf(r.from));
  return '';
}
const inRp=(d,r)=>(!r.from||d>=r.from)&&(!r.to||d<=r.to);

    ${R.u==='c'?`<span class="rprng"><input class="inp auto" type="date" data-chg="rpFrom" value="${R.from}" aria-label="開始日"><span>〜</span><input class="inp auto" type="date" data-chg="rpTo" value="${R.to}" aria-label="終了日"></span>
      <span class="chips">${[['直近7日',-6],['直近30日',-29],['直近90日',-89]].map(([l,n])=>`<button type="button" data-act="rpQuick" data-n="${n}">${l}</button>`).join('')}</span>`:''}

  h+=`<div class="small muted" style="margin:-4px 0 10px">${R.u==='all'?'全期間':R.from===R.to?jd(R.from):`${jd(R.from)}〜${jd(R.to)}`}　${list.length}件</div>`;

  return h+`</div>`;

/* ================= 出退勤・勤怠 ================= */
VIEWS.time=()=>{

  const tab=simple?'card':VS.tTab;
  let h=`<div class="vhead"><h1>${simple?'タイムカード':'出退勤・勤怠'}</h1></div>`;

  if(tab==='today'){
    const t=today();
    const allS=staffList(); const q=F('t_q'), fst=F('t_st'), fsi=F('t_site',siteDef()), fk=F('t_kind');

function evSiteIds(e){ if(e.siteId) return [e.siteId]; if(e.customerId) return all('sites').filter(x=>x.customerId===e.customerId).map(x=>x.id); return []; }
function evRelated(e){
  const ids=evSiteIds(e); if(!ids.length&&!e.customerId) return null;

  evAll().forEach(x=>{ if(x.id!==e.id&&(ids.includes(x.siteId)||(e.customerId&&x.customerId===e.customerId))) (x.staffIds||[]).forEach(id=>set.add(id)); });
  return set;
}

function evsG(){ const gs=evsGroups().map(x=>x[0]); if(sheet.sg&&gs.includes(sheet.sg)) return sheet.sg; const rel=evRelated(sheet.e); return rel&&rel.size?'site':'emp'; }

function addTag(r,t){
  const has=x=>r.tags.some(y=>y.k===x.k&&y.id===x.id);

  if(t.k==='job'){ const st=get('jobs',t.id)?.siteId; if(st&&!has({k:'site',id:st})) r.tags.push({k:'site',id:st}); }
}
function tagsEditHtml(r,sugs){
  const other=r.tags.filter(t=>t.k!=='customer'&&t.k!=='site');
  return other.map(t=>tagHtml(t,{act:'repTagRm',x:true})).join('')+sugs.map(t=>tagHtml(t,{act:'repTagAdd',sug:true})).join('')+
    (!other.length&&!sugs.length?'<span class="hint">本文に名前を書くと、ここに候補が出ます</span>':'')+
    (sugs.length>1?`<button class="btn sm ghost" type="button" data-act="repTagAll">候補をすべて追加</button>`:'');
}

function csRecent(){

function csPickHtml(){
  return `<div class="cpick"><input class="inp" id="cs-q" placeholder="顧客名・現場名で探す（一部だけでOK）" value="${esc(sheet.pq||'')}" autocomplete="off"><div id="cs-list">${csListHtml()}</div></div>`;
}
function csListHtml(){
  const r=sheet.r; const q=(sheet.pq||'').trim(); const on=(k,id)=>r.tags.some(t=>t.k===k&&t.id===id);
  const sb=(st)=>{ const cn=get('customers',st.customerId)?.name||''; const nm=(cn&&st.name.startsWith(cn)?st.name.slice(cn.length).trim():'')||st.name; return `<button type="button" data-act="csPick" data-k="site" data-id="${st.id}" aria-pressed="${on('site',st.id)}">${esc(nm)}</button>`; };
  let h='';
  if(!q){ const rc=csRecent(); if(rc.length) h+=`<div class="cp-h">よく使う現場</div><div class="chips">${rc.map(id=>{const st=get('sites',id); return `<button type="button" data-act="csPick" data-k="site" data-id="${id}" aria-pressed="${on('site',id)}">${esc(st.name)}</button>`;}).join('')}</div>`; }
  const sites=all('sites'); const custs=all('customers').slice().sort(by(c=>c.name||''));
  const rows=[];
  custs.forEach(c=>{
    const ss=sites.filter(st=>st.customerId===c.id).sort(by(st=>st.name||''));
    const cHit=nameHit(c,q); const sHit=ss.filter(st=>nameHit(st,q));
    if(!cHit&&!sHit.length) return;
    const show=cHit?ss:sHit;
    rows.push(`<div class="cp-row"><button type="button" class="cp-c" data-act="csPick" data-k="customer" data-id="${c.id}" aria-pressed="${on('customer',c.id)}"><span class="k">顧客</span>${esc(c.name)}</button>${show.length?`<div class="chips">${show.map(sb).join('')}</div>`:'<span class="small muted">現場なし</span>'}</div>`);
  });
  const orphan=sites.filter(st=>!get('customers',st.customerId)&&nameHit(st,q));
  if(orphan.length) rows.push(`<div class="cp-row"><span class="small muted">顧客未設定の現場</span><div class="chips">${orphan.map(sb).join('')}</div></div>`);
  h+=unregPickHtml(q);
  h+=`<div class="cp-h">${q?`「${esc(q)}」の検索結果 ${rows.length}件`:'すべての顧客'}</div>`+(rows.length?`<div class="cp-list">${rows.join('')}</div>`:'<div class="empty">見つかりません</div>');
  return h;
}

function csPick(k,id){
  const r=sheet.r; const has=r.tags.some(t=>t.k===k&&t.id===id);
  if(has){ r.tags=r.tags.filter(t=>!(t.k===k&&t.id===id)&&!(k==='customer'&&t.k==='site'&&get('sites',t.id)?.customerId===id)); r.off.push(k+':'+id); }
  else { r.off=(r.off||[]).filter(x=>x!==k+':'+id); addTag(r,{k,id}); }

}

function mentionCheck(ta){

}

/* ================= シフト（現場・持ち場・勤務パターン方式） ================= */
/* データ:
   areas    持ち場     {siteId,name,order,needs:{def:{patId:n},w0..w6:{patId:n}}}
   patterns 勤務パターン {siteId,areaId(''=現場共通),code,start,end,breakMin,color,hidden}
   shifts   月のシフト  id=`${siteId}_${YYYY-MM}` {siteId,ym,cells:{"staffId|day":[{p:patId,a:areaId,l:1(鍵)}]}}
   staff    シフト対象  shift:true, shiftSites:[siteId], areaIds:[areaId], skills:{patId:1(○)|2(◎)},
                        cond:{days:[0-6],wMax,mMax,mMin,consec,multi,pattern:'2勤1休',prio}
   wishes   希望・休み  kind: off(希望休) on(出勤希望) paid(有給) x(固定休)
   meta     公開状態    id=`pub_${siteId}_${YYYY-MM}` {published}                                  */
const isShiftStaff=s=>!!s?.shift;
const PAL=['#2b6fd6','#2f8f5b','#c06a12','#8a4fc7','#c23d6b','#1a8c94','#8a7a12','#4b5bd6','#7a8291','#b0281f'];
const siteShort=s=>s?.short||String(s?.name||'').replace(/^株式会社|\s.*/g,'').slice(0,3);
const areasOf=sid=>all('areas').filter(a=>a.siteId===sid&&!a.whole).sort(by(a=>a.order||0));
const aKey=a=>a&&!a.whole?a.id:'';
const scopeList=sid=>areasOf(sid).length?areasOf(sid):[get('areas','all_'+sid)||null];
const aPats=(sid,a)=>patsOf(sid,a&&!a.whole?a.id:undefined);
const codeKey=c=>String(c).length+':'+c;
const patsOf=(sid,aid,inclHidden)=>all('patterns').filter(p=>p.siteId===sid&&(inclHidden||!p.hidden)&&(aid===undefined||!p.areaId||p.areaId===aid)).sort(by(p=>(p.areaId?'1'+(get('areas',p.areaId)?.order||0):'0')+codeKey(p.code)));
const patFor=(sid,aid,code)=>{ const ps=all('patterns').filter(p=>p.siteId===sid&&!p.hidden&&String(p.code).toUpperCase()===String(code).toUpperCase()); return ps.find(p=>aid&&p.areaId===aid)||ps.find(p=>!p.areaId)||(!aid?ps[0]:null); };
const patMin=p=>{ if(!p) return 0; let a=toMin(p.start),b=toMin(p.end); if(a==null||b==null) return 0; if(b<=a) b+=1440; return b-a-(+p.breakMin||0); };
const patLabel=p=>p?`${p.start.replace(/^0/,'')}〜${p.end.replace(/^0/,'')}`:'';
const shiftDocId=(sid,ym)=>`${sid}_${ym}`;
const shiftDoc=(sid,ym)=>get('shifts',shiftDocId(sid,ym))||{siteId:sid,ym,cells:{}};
const cellOf=(sid,ym,stf,day)=>(shiftDoc(sid,ym).cells||{})[`${stf}|${day}`]||[];
const shiftStaffOf=sid=>staffList().filter(s=>isShiftStaff(s)&&(s.shiftSites||[]).includes(sid));
const shiftStaff=()=>staffList().filter(isShiftStaff);
const shiftCfg=()=>({travelMin:30,...(get('meta','shiftcfg')||{})});
const shiftPublished=(ym,siteId)=>!!(get('meta','shift_'+ym)?.published||(siteId&&get('meta',`pub_${siteId}_${ym}`)?.published));
const wishId=(sid,d)=>`${sid}_${d}`;
const wishOf=(sid,d)=>get('wishes',wishId(sid,d));
const daysOfMonth=m=>{const a=[]; for(let d=m+'-01';ymOf(d)===m;d=addDays(d,1)) a.push(d); return a;};
const WISH={off:{l:'希',t:'希望休',c:'w-off'},paid:{l:'有',t:'有給',c:'w-paid'},x:{l:'×',t:'固定休',c:'w-x'},on:{l:'出',t:'出勤希望',c:'w-on'}};
const wishLabel=w=>!w?'':w.kind==='on'?`出勤希望${w.start?' '+w.start.replace(/^0/,'')+'〜'+(w.end||''):''}`:WISH[w.kind]?.t||'';

/* その日の休みの内容（希望休・有給・固定休・出勤できない曜日） */
function restOf(s,date){
  const w=wishOf(s?.id,date);

const evAll=()=>isPartner(me())?[...all('events').filter(e=>!e.tpl&&(e.staffIds||[]).includes(meId())),...poEvents()]:[...all('events').filter(e=>!e.tpl),...shiftVirtual(),...SHELL.visitsAsEvents()];

/* 1日の予定（全現場）と、重なり・移動時間の判定 */
function dayItems(staffId,date){
  return evAll().filter(e=>e.date===date&&(e.staffIds||[]).includes(staffId)&&e.start&&e.end).map(e=>{ let a=toMin(e.start),b=toMin(e.end); if(b<=a) b+=1440; return {e,a,b,site:e.siteId||''}; }).sort(by(x=>x.a)); }
function dayConflict(staffId,date){
  const it=dayItems(staffId,date); const tm=shiftCfg().travelMin; let lv=0; const msg=[];
  for(let i=0;i<it.length;i++) for(let j=i+1;j<it.length;j++){ const x=it[i],y=it[j];
    if(y.a<x.b){ lv=2; msg.push(`${x.e.title} と ${y.e.title} の時間が重なっています`); }
    else if(x.site!==y.site&&y.a-x.b<tm){ lv=Math.max(lv,1); msg.push(`${siteShort(get('sites',x.site))}→${siteShort(get('sites',y.site))} の移動が${y.a-x.b}分しかありません`); } }
  return {lv,msg}; }

/* ---------- シフト表 ---------- */
function shSites(){ const withP=new Set(all('patterns').map(p=>p.siteId)); return sitesOf().filter(s=>withP.has(s.id)).concat(sitesOf().filter(s=>!withP.has(s.id))); }
function shCur(){ const ss=shSites(); if(!VS.shSite&&mySites().length) VS.shSite=mySites()[0]; let site=get('sites',VS.shSite); if(!site||(VS.shCust&&site.customerId!==VS.shCust)) site=ss.find(s=>!VS.shCust||s.customerId===VS.shCust); VS.shSite=site?.id||''; if(VS.shArea&&get('areas',VS.shArea)?.siteId!==VS.shSite) VS.shArea=''; return site; }
function cellView(site,ym,s,day,areaId){
  const date=`${ym}-${pad(day)}`; const own=cellOf(site.id,ym,s.id,day); const w=wishOf(s.id,date);
  const mine=own.filter(c=>!areaId||c.a===areaId); const otherArea=own.filter(c=>areaId&&c.a!==areaId);
  const others=evAll().filter(e=>e.date===date&&(e.staffIds||[]).includes(s.id)&&e.shift&&e.siteId!==site.id);
  const conf=(own.length+others.length)>1||(own.length&&evAll().some(e=>!e.shift&&e.date===date&&(e.staffIds||[]).includes(s.id)&&e.start))?dayConflict(s.id,date):{lv:0,msg:[]};
  const chips=mine.map(c=>{ const p=patOfCell(c); return p?`<span class="pc ${c.l?'lk':''}" style="--pcol:${p.color||PAL[0]}">${esc(p.code)}</span>`:''; }).join('');

  const cellsAt=(sid,date)=>{ if(ymOf(date)!==ym) return []; return cells[`${sid}|${+date.slice(8)}`]||[]; };
  const worked=(sid,date)=>cellsAt(sid,date).length>0||(ext[sid+'|'+date]||[]).some(e=>e.shift);
  const cnt={}; staff.forEach(s=>{ cnt[s.id]={days:0,pat:{}}; days.forEach(d=>{ if(worked(s.id,d)) cnt[s.id].days++; cellsAt(s.id,d).forEach(c=>cnt[s.id].pat[c.p]=(cnt[s.id].pat[c.p]||0)+1); }); });
  const runBefore=(sid,date)=>{ let r=0,d=addDays(date,-1); while(worked(sid,d)&&r<40){r++;d=addDays(d,-1);} return r; };
  const restBefore=(sid,date)=>{ let r=0,d=addDays(date,-1); while(!worked(sid,d)&&r<40){r++;d=addDays(d,-1);} return {r,run:runBefore(sid,addDays(date,-r))}; };
  const weekCnt=(sid,date)=>{ const mon=weekMon(date); let c=0; for(let i=0;i<7;i++){ const d=addDays(mon,i); if(d!==date&&worked(sid,d)) c++; } return c; };
  let added=0; const shorts=[];
  days.forEach((date,di)=>{ const day=di+1, wd=wdOf(date);
    const slots=[]; areas.forEach(a=>aPats(siteId,a).forEach(p=>{ const need=needOf(a,p.id,wd); if(!need) return; const have=Object.entries(cells).filter(([k])=>k.endsWith('|'+day)).reduce((n,[,arr])=>n+arr.filter(c=>c.p===p.id&&(c.a||'')===aKey(a)).length,0); if(need>have) slots.push({a,p,n:need-have}); }));
    const ok=(s,p)=>{ const c=s.cond||{}; const w=wishOf(s.id,date);

      if(w&&w.kind!=='on') return false;

      for(const e of ex){ const [ea,eb]=iv(e.start,e.end); if(a<eb&&ea<b) return false; if(e.siteId&&e.siteId!==siteId&&(Math.abs(a-eb)<tm||Math.abs(ea-b)<tm)) return false; }

    const cmp=(x,y)=>{ for(let i=0;i<x.length;i++){ if(x[i]!==y[i]) return x[i]-y[i]; } return 0; };

  });

/* ================= 打刻の修正申請 ================= */
const FIX_TONE={申請中:'w',承認:'g',差戻し:'r'};
const fixFor=(sid,d)=>all('fixreqs').filter(f=>f.staffId===sid&&f.date===d).sort(by(f=>f.at||'',-1))[0];
const pendingFix=()=>all('fixreqs').filter(f=>f.status==='申請中'&&SHELL.canApproveFor(f.staffId,meId())).sort(by(f=>f.at||''));
const pv=p=>`${p?.in||'—'}〜${p?.out||'—'}（休憩${p?.in||p?.out?(+p?.breakMin||0)+'分':'—'}）`;
function openFix(sid,d){
  const cur=punchOf(sid,d); const f=fixFor(sid,d);
  const req=f&&f.status==='申請中'?{...f.req}:{in:cur?.in||'',out:cur?.out||'',breakMin:cur?.breakMin??60};

SHEETS.fix=()=>{
  const {sid,date,req}=sheet; const cur=punchOf(sid,date); const last=fixFor(sid,date);
  const body=`<div class="sec"><div class="callout">${jd(date)}　いまの打刻：<b class="num">${pv(cur)}</b></div>
    ${last&&last.status!=='申請中'?`<div class="callout ${last.status==='承認'?'g':'w'}">前回の申請：${last.status}${last.comment?`（${esc(last.comment)}）`:''}</div>`:''}
    <div class="form"><label class="fld"><span>正しい出勤</span><input class="inp" type="time" data-fx="in" value="${req.in||''}"></label><label class="fld"><span>正しい退勤</span><input class="inp" type="time" data-fx="out" value="${req.out||''}"></label><label class="fld"><span>休憩（分）</span><input class="inp" type="number" min="0" step="5" data-fx="breakMin" value="${req.breakMin??60}"></label></div>
    <label class="fld"><span>理由（必須）</span><input class="inp" data-fx="reason" value="${esc(sheet.reason||'')}" placeholder="例：退勤の打刻を忘れた、現場から直帰した"></label>
    <div class="hint">申請すると管理者に届き、承認されるとタイムカードに反映されます。</div></div>`;
  const foot=`${sheet.fid?'<button class="btn danger l" data-act="fixCancel">申請を取り下げ</button>':''}<button class="btn" data-act="close">キャンセル</button><button class="btn pri" data-act="fixSend">${sheet.fid?'申請を更新':'修正を申請'}</button>`;

async function sendFix(){
  const {sid,date,req,fid}=sheet; if(!String(sheet.reason||'').trim()) return toast('理由を入れてください');
  const cur=punchOf(sid,date);
  await put('fixreqs',fid||null,{staffId:sid,date,cur:{in:cur?.in||'',out:cur?.out||'',breakMin:cur?.breakMin??''},req:{in:req.in||'',out:req.out||'',breakMin:+req.breakMin||0},reason:sheet.reason,status:'申請中',at:new Date().toISOString()});
  closeSheet(); toast('修正を申請しました。承認されるとタイムカードに反映されます');
}
async function approveFix(id){
  const f=get('fixreqs',id); if(!f) return; const cur=punchOf(f.staffId,f.date)||{}; const at=new Date().toISOString(); const by='承認：'+(me()?.name||'');
  const edits=[...(cur.edits||[])];
  [['in','出勤'],['out','退勤'],['breakMin','休憩']].forEach(([k,l])=>{ if(String(cur[k]??'')!==String(f.req[k]??'')) edits.push({f:l,from:String(cur[k]??''),to:String(f.req[k]??''),at,by}); });
  await put('punches',punchId(f.staffId,f.date),{...cur,staffId:f.staffId,date:f.date,in:f.req.in,out:f.req.out,breakMin:+f.req.breakMin||0,note:cur.note?cur.note:f.reason,edits});
  await put('fixreqs',id,{...f,status:'承認',reviewer:meId(),reviewedAt:at});
  toast(`${staffName(f.staffId)}さんの申請を承認し、タイムカードに反映しました`);
}
async function rejectFix(id){
  const f=get('fixreqs',id); const c=($('#fc-'+id)?.value||'').trim(); if(!c){ toast('差戻しの理由を入れてください'); $('#fc-'+id)?.focus(); return; }
  await put('fixreqs',id,{...f,status:'差戻し',comment:c,reviewer:meId(),reviewedAt:new Date().toISOString()});
  toast('差戻しました');
}

/* ================= イベント処理 ================= */
docOn('click',async ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(el.closest('.cev')&&a!=='openEvent') return;
  if(a==='openEvent'||a==='openReport'||a==='rel'||a==='repTagRm'||a==='repTagAdd') ev.stopPropagation();
  if(typeof ACT_S!=='undefined'&&ACT_S[a]){ await ACT_S[a](el,ev); return; }
  switch(a){
    case 'openPo': VS.poRepKey=''; if(!isPartnerUser()&&el.dataset.internal){ SHELL.openOrder(el.dataset.id); break; } openSheet({kind:'porder',id:el.dataset.id}); poRecordView(el.dataset.id); break;
    case 'poAck': await poAnswer(el.dataset.v||'了承'); break;
    case 'poAsk': await poAsk(); break;
    case 'poOpenOrder': closeSheet(); SHELL.openOrder(el.dataset.id); break;
    case 'openAp': SHELL.openApprovals(); break;
    case 'ackNotice': SHELL.ackNotice(el.dataset.id); break;
    case 'openJob': SHELL.openJob(el.dataset.id); break;
    case 'monthClose': await monthClose(el.dataset.m); break;
    case 'monthOpen': await monthOpen(el.dataset.m); break;
    case 'rvdone': { const r=sheet?.r; if(!r) break; const v=el.dataset.id, a=new Set(r.vdone||[]); a.has(v)?a.delete(v):a.add(v); r.vdone=[...a]; renderOverlay(); break; }
    case 'fvSave': await SHELL.visitPatch(sheet.id,{reportNote:ROOT.querySelector('#fv-note')?.value||''}); toast('保存しました'); renderOverlay(); break;
    case 'fvDone': await SHELL.visitDone(sheet.id,ROOT.querySelector('#fv-note')?.value??null); toast('作業を完了にしました'); renderOverlay(); break;
    case 'poRepNew': VS.poRepKey=el.dataset.k; renderOverlay(); break;
    case 'poRepCancel': VS.poRepKey=''; renderOverlay(); break;
    case 'poRepSend': await poRepSend(el.dataset.k); break;
    case 'poRepOk': await SHELL.poRepOk(el.dataset.id,el.dataset.k); renderOverlay(); break;
    case 'poReplyS': await poReplyS(); break;
    case 'poContactS': await poContactS(); break;
    case 'pocCopy': case 'pocMail': case 'pocLine': await pocAct(a); break;
    case 'unregAdd': unregAdd(el.dataset.k,el.dataset.name,el.dataset.c); break;
    case 'unregRm': { const r=sheet.r; r.unreg=(r.unreg||[]).filter((_,i)=>i!==+el.dataset.i); refreshRepTags(); break; }
    case 'unregReq': { const r=sheet.r; const u=(r.unreg||[])[+el.dataset.i]; if(u){ u.req=true; toast('保存すると事務所に登録の依頼が届きます'); } refreshRepTags(); break; }
    case 'unregOpen': VS.unregOpen=VS.unregOpen===el.dataset.id?'':el.dataset.id; render(); break;
    case 'unregNew': await unregNew(el.dataset.id); break;
    case 'unregAlias': await unregAlias(el.dataset.id); break;
    case 'go': VS.route=el.dataset.r; closeSheet(); window.scrollTo(0,0); render(); break;
    case 'close': closeSheet(); break;
    case 'seed': await SHELL.seed(); break;
    case 'punchIn': await punchIn(); break;
    case 'punchOut': await punchOut(); break;
    case 'calDispatch': VS.route='calendar'; P.calView='week'; P.calWho='all'; P.dispatchOnly=true; VS.calDate=today(); savePrefs(); render(); break;
    case 'calView': P.calView=el.dataset.v; savePrefs(); render(); break;
    case 'calNav': { const n=+el.dataset.n; const v=P.calView; VS.calDate=v==='month'?ymAdd(ymOf(VS.calDate),n)+'-01':addDays(VS.calDate,v==='week'?7*n:n); if(v==='day') VS.calSel=VS.calDate; render(); break; }
    case 'calToday': VS.calDate=today(); VS.calSel=today(); render(); break;
    case 'calDay': { const d=el.dataset.date; if(VS.wishMode&&isShiftStaff(me())){ VS.calSel=d; await cycleWish(meId(),d); break; } if(matchMedia('(max-width:900px)').matches||VS.calSel!==d){ VS.calSel=d; render(); } else newEvent(d); break; }
    case 'dispatchOnly': P.dispatchOnly=!P.dispatchOnly; savePrefs(); render(); break;
    case 'newEvent': newEvent(el.dataset.date,el.dataset.staff); break;
    case 'openEvent': { const id=el.dataset.id; if(String(id).startsWith('po~')){ VS.poRepKey=''; openSheet({kind:'porder',id:String(id).slice(3)}); poRecordView(String(id).slice(3)); break; } if(String(id).startsWith('vs~')){ SHELL.openVisit(String(id).slice(3)); break; } if(String(id).startsWith('sh~')){ const [,site,ym,sid,day]=id.split('~'); openCell(site,ym,sid,day); break; } const e=get('events',id); if(e) openSheet({kind:'event',e:{note:'',siteId:'',jobId:'',customerId:'',...structuredClone(e)}}); break; }
    case 'evType': sheet.e.type=el.dataset.v; tyApply(sheet.e); renderOverlay(); break;
    case 'evStaff': { const s=sheet.e.staffIds||[]; const id=el.dataset.id; sheet.e.staffIds=s.includes(id)?s.filter(x=>x!==id):[...s,id]; refreshEvStaff(); break; }
    case 'evsPfClear': sheet.pc='';sheet.ps='';sheet.pa=''; refreshEvStaff(); break;
    case 'evsG': sheet.sg=el.dataset.g; sheet.sq=''; const qi=$('#ev-sq'); if(qi) qi.value=''; ROOT.querySelectorAll('[data-act="evsG"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===sheet.sg)); refreshEvStaff(); break;
    case 'evApplySug': { const k=el.dataset.k,id=el.dataset.id; if(k==='site'){ sheet.e.siteId=id; sheet.e.customerId=get('sites',id)?.customerId||''; } else sheet.e.customerId=id; renderOverlay(); break; }
    case 'evSave': await saveEventR(); break;
    case 'scope': await applyScope(el.dataset.v); break;
    case 'evCopy': copyEvent(); break;
    case 'tplSave': await tplSave(); break;
    case 'tplUse': tplUse(el.dataset.id); break;
    case 'tplDel': await tplDel(el.dataset.id); break;
    case 'rcKind': { const r=sheet.rule, d=sheet.e.date||today(); r.kind=el.dataset.v; r.every=r.every||1; if(r.kind==='weekly'&&!(r.wds||[]).length) r.wds=[parseD(d).getDay()]; if(r.kind==='monthly'&&!(r.mdays||[]).length&&!(r.nths||[]).length) r.mdays=[+d.slice(8)]; sheet.rcOpen=true; renderOverlay(); break; }
    case 'rcWd': { const r=sheet.rule, v=+el.dataset.v; r.wds=(r.wds||[]).includes(v)?r.wds.filter(x=>x!==v):[...(r.wds||[]),v]; renderOverlay(); break; }
    case 'rcMd': { const r=sheet.rule, v=el.dataset.v==='L'?'L':+el.dataset.v; r.mdays=(r.mdays||[]).includes(v)?r.mdays.filter(x=>x!==v):[...(r.mdays||[]),v]; renderOverlay(); break; }

docOn('change',ev=>{
  const el=ev.target;
  if(el.dataset.fs){ setF(el.dataset.fs,el.value); render(); return; }
  if(el.dataset.chg){ const k=el.dataset.chg; const v=el.type==='checkbox'?el.checked:el.value;
    if(k==='rpFrom'||k==='rpTo'){ const r=rp(); const f=k==='rpFrom'?'from':'to'; r[f]=v; if(r.from&&r.to&&r.from>r.to){ if(f==='from') r.to=r.from; else r.from=r.to; } render(); return; }
    if(k==='me'){ P.me=v; savePrefs(); VS.tStaff=''; closeSheet(); render(); toast(`${staffName(v)}さんとして表示しています${get('staff',v)?modeTag(get('staff',v)):''}`); return; }
    if(k==='addShiftStaff'){ const s=get('staff',v); if(s) put('staff',s.id,{...s,shift:true,shiftSites:[...new Set([...(s.shiftSites||[]),VS.shSite])]}); return; }
    if(k==='shCust'){ VS.shCust=v; VS.shSite=''; VS.shArea=''; render(); return; }
    if(k==='shSite'){ VS.shSite=v; VS.shArea=''; VS.ssArea=''; render(); return; }
    if(['calWho','calView','openDetail','repWho'].includes(k)){ P[k]=v; savePrefs(); }
    else VS[k]=v;
    render(); return; }
  if(el.dataset.need){ const [aid,row,pid]=el.dataset.need.split('|'); let a=get('areas',aid)||(el.dataset.whole?{siteId:el.dataset.whole,name:'現場全体',order:0,needs:{},whole:true}:null); if(!a) return; const needs=structuredClone(a.needs||{}); needs[row]={...(needs[row]||{})}; if(el.value==='') delete needs[row][pid]; else needs[row][pid]=+el.value; const {id,...rest}=a; put('areas',aid,{...rest,needs}); return; }
  if(el.dataset.cfg){ put('meta','shiftcfg',{...shiftCfg(),[el.dataset.cfg]:+el.value||0}); return; }
  if(el.dataset.cfgb){ put('meta','shiftcfg',{...shiftCfg(),[el.dataset.cfgb]:el.checked}); return; }
  if(el.dataset.bz&&BIZLIB){ const v=el.value.trim(); if(v) put('bizlib','pat_'+el.dataset.bz,{kind:'pattern',refId:el.dataset.bz,code:v}); else del('bizlib','pat_'+el.dataset.bz); return; }
  if(!sheet) return;
  if(el.dataset.pt){ sheet.p[el.dataset.pt]=el.type==='checkbox'?el.checked:el.value; renderOverlay(); }
  if(el.dataset.cd){ sheet.s.cond={...(sheet.s.cond||{}),[el.dataset.cd]:el.dataset.cd==='pattern'?el.value:(el.value===''?'':+el.value)}; }
  if(el.dataset.sf){ const e=sheet.e; const f=el.dataset.sf; e[f]=el.type==='checkbox'?el.checked:el.value;
    if(f==='customerId'){ if(e.siteId&&get('sites',e.siteId)?.customerId!==e.customerId) e.siteId=''; if(e.jobId&&get('jobs',e.jobId)?.customerId!==e.customerId) e.jobId=''; }
    if(f==='siteId'&&e.siteId&&!e.customerId) e.customerId=get('sites',e.siteId)?.customerId||'';
    if(['customerId','siteId','dispatch'].includes(f)) renderOverlay(); }
  if(el.dataset.rf){ const r=sheet.r; const f=el.dataset.rf; r[f]=el.type==='checkbox'?el.checked:el.value; if(['date','staffId','kind'].includes(f)) renderOverlay(); }
  if(el.dataset.pf){ sheet.p[el.dataset.pf]=el.value; }
  if(el.dataset.mf){ const o=sheet.s||sheet.m; o[el.dataset.mf]=el.dataset.mf==='color'?+el.value:el.value;
    if(el.type==='checkbox'){ o[el.dataset.mf]=el.checked; renderOverlay(); }
    if(el.dataset.mf==='customerId') renderOverlay(); }
  if(el.dataset.shf){ sheet.f[el.dataset.shf]=el.value; }
  if(el.dataset.fx){ if(el.dataset.fx==='reason') sheet.reason=el.value; else sheet.req[el.dataset.fx]=el.value; }

});

/* ---------- boot ---------- */
async function boot(){
  loadPrefs();
  render();
  const use=n=>SHELL.use(n);
  const [d,u]=await Promise.all([use('db'),use('user')]);
  if(u){ try{viewerId=await u.id();}catch(_){} try{const w=await u.can('data.write'); if(w===false) readOnly=true;}catch(_){} }
  if(d){
    db=d; MODE='db';
    COLS.forEach(c=>{
      db.collection(c).onSnapshot(snap=>{ const m=new Map(); snap.docs.forEach(x=>m.set(x.id,{id:x.id,...x.data()})); D[c]=m; dataVer++; loaded.add(c); requestRender(); },
        err=>{ toast('データの受信が止まりました。ページを開き直してください'); });
    });
  } else {
    MODE='memory';
    const s=makeSample(); Object.entries(s).forEach(([c,l])=>l.forEach(r=>D[c].set(r.id,{...r})));
    COLS.forEach(c=>loaded.add(c)); dataVer++; if(!get('staff',P.me)) P.me='smp_s1'; render();
  }
}

const yenS=n=>'¥'+Math.round(+n||0).toLocaleString('ja-JP');
const poWhenS=iso=>{ if(!iso) return ''; const d=new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const poStateS=p=>SHELL.poState(p);
const poUnseen=p=>(p.upd||0)>((p.seen||{})[meId()]||0)&&!p.cancelled;
const poRank=p=>{ const s=poStateS(p); return s.todo?0:s.key==='q'?1:s.key==='ok'?2:3; };
const poRange=p=>{ const ds=(p.schedule||[]).map(r=>r.date).filter(Boolean).sort(); if(!ds.length) return '日程未定'; return ds.length===1?jd(ds[0]):`${jd(ds[0])}〜${jd(ds[ds.length-1])}（${ds.length}日）`; };
const isPartnerUser=()=>isPartner(me());

  if(isPartnerUser()) return myPorders().filter(p=>poStateS(p).todo||poUnseen(p)).length;
  return all('porders').filter(p=>{ const s=poStateS(p); return s.key==='q'||s.over; }).length;

function poCard(p){

async function poRecordView(id){
  const p=get('porders',id); if(!p||!isPartnerUser()||p.partnerId!==meId()) return;
  const last=(p.views||[]).filter(v=>v.by===meId()).slice(-1)[0];

  const addView=!last||Date.now()-new Date(last.at).getTime()>=30*60e3;
  if(!addView&&(p.seen||{})[meId()]===(p.upd||0)) return;
  await put('porders',id,{...p,seen,views:addView?[...(p.views||[]),{by:meId(),byName:staffName(meId()),at:new Date().toISOString()}].slice(-30):(p.views||[])});
}

async function poRepSend(k){

/* =========================================================
   勤怠の締め（タイムカード・シフト）
   締めた月は、打刻・修正申請・休み希望・シフトを変更できない（管理者は解除できる）。
   シフトは締めた時点のパターン（時間・休憩）を各マスに書き写すので、
   あとでパターンを変えても締めた月の時間は変わらない。
   タイムカードの実働・残業は打刻だけから計算している（シフトは使わない）。
   ========================================================= */
const roleS=()=>{ const m=me(); return m?.kind==='協力会社'?'partner':(m?.role||'staff'); };
const closeOf=ym=>{ const c=get('meta','close_'+ym); return c&&c.closed?c:null; };
const patOfCell=c=>c?.fz||get('patterns',c?.p);
function lockedMonthOf(col,id,data){
  if(!['punches','fixreqs','wishes','shifts'].includes(col)) return '';
  if(col==='fixreqs'&&data&&data.status==='差戻し') return '';
  const cur=id?get(col,id):null;
  const ms=col==='shifts'?[data?.ym,cur?.ym]:[ymOf(data?.date||''),ymOf(cur?.date||'')];
  return ms.find(m=>m&&closeOf(m))||'';
}
function put(col,id,data){
  const m=lockedMonthOf(col,id,data);
  if(m&&roleS()!=='admin'&&!closingNow){ toast(`${ymLabel(m)}は勤怠を締めたため変更できません（管理者に解除を依頼してください）`); return Promise.resolve(id); }
  return put0(col,id,data);
}
function del(col,id){
  const m=lockedMonthOf(col,id,null);
  if(m&&roleS()!=='admin'){ toast(`${ymLabel(m)}は勤怠を締めたため変更できません`); return Promise.resolve(); }
  return del0(col,id);
}
let closingNow=false;
function closeBar(m){
  const c=closeOf(m), r=roleS(), canClose=['admin','lead'].includes(r)||(me()?.extra||[]).includes('time.close');
  if(c) return `<div class="callout g" style="margin:8px 0"><span><b>${ymLabel(m)}は締め済み</b>（${esc(staffName(c.by))} ${esc(String(c.at||'').slice(0,10))}）。打刻・修正申請・休み希望・シフトは変更できません。シフトの時間は締めた時点のパターンで固定しています。</span>${r==='admin'?`<button class="btn sm" data-act="monthOpen" data-m="${m}">締めを解除</button>`:''}</div>`;
  if(isSimple()||!canClose) return '';
  if(m>=ymOf(today())&&m!==ymOf(addDays(today(),-1))) return '';
  const pend=all('fixreqs').filter(f=>f.status==='申請中'&&ymOf(f.date)===m).length;
  return `<div class="callout" style="margin:8px 0"><span>${ymLabel(m)}の勤怠はまだ締めていません。${pend?`<b>承認待ちの修正申請が${pend}件</b>あります。`:''}給与計算に渡す前に締めると、あとから打刻やシフトが変わらなくなります。</span><button class="btn sm pri" data-act="monthClose" data-m="${m}">${ymLabel(m)}を締める</button></div>`;
}
async function monthClose(m){
  const pend=all('fixreqs').filter(f=>f.status==='申請中'&&ymOf(f.date)===m).length;
  if(pend&&!confirmClose[m]){ confirmClose[m]=true; toast(`承認待ちの修正申請が${pend}件あります。もう一度押すとそのまま締めます`); return; }
  closingNow=true;
  try{
    for(const d of all('shifts').filter(d=>d.ym===m)){
      const cells=Object.fromEntries(Object.entries(d.cells||{}).map(([k,arr])=>[k,(arr||[]).map(c=>{ const p=get('patterns',c.p); return p&&!c.fz?{...c,fz:{code:p.code||'',start:p.start||'',end:p.end||'',breakMin:+p.breakMin||0,color:p.color||'',name:p.name||''}}:c; })]));
      await put0('shifts',d.id,{...d,cells,closed:true});
    }
    await put0('meta','close_'+m,{kind:'close',ym:m,closed:true,at:new Date().toISOString(),by:meId()});
  } finally { closingNow=false; }
  toast(`${ymLabel(m)}の勤怠を締めました`);
}
const confirmClose={};
async function monthOpen(m){
  if(roleS()!=='admin') return toast('締めの解除は管理者だけができます');
  const c=get('meta','close_'+m); if(!c) return;
  await put0('meta','close_'+m,{...c,closed:false,reopenedAt:new Date().toISOString(),reopenedBy:meId()});
  toast(`${ymLabel(m)}の締めを解除しました（シフトの時間は締めた時点のまま。パターンから直すときはマスを入れ直してください）`);
}

/* =========================================================
   週の型（曜日×現場×勤務パターン）と出勤指定（日にち指定）
   ・staff.week = [{id,wd,siteId,areaId,patId('':おまかせ),rule:{kind:'all'|'alt'|'nth',nth:[1,3],anchor},from,to}]
   ・出勤指定 = wishes kind:'fix' {staffId,date,siteId,areaId,patId,by,at}（その日だけ休みは固定休 kind:'x'）
   ・優先：出勤指定 ＞ 希望休（警告） ＞ 週の型。週の型は希望休・有給・固定休の日には入れない
   ========================================================= */
const canPlan=()=>['admin','lead','manager'].includes(roleS());
const fixesOf=(sid,date)=>all('wishes').filter(w=>w.kind==='fix'&&w.staffId===sid&&(!date||w.date===date));
const WEEK_RULE_L={all:'毎週',alt:'隔週',nth:'第n週'};
function weekRuleHit(e,date){
  if(e.from&&date<e.from) return false; if(e.to&&date>e.to) return false;
  const r=e.rule||{kind:'all'};
  if(r.kind==='alt'){ const a=weekMon(r.anchor||e.from||date); const diff=Math.round((parseD(weekMon(date))-parseD(a))/864e5/7); return ((diff%2)+2)%2===0; }
  if(r.kind==='nth'){ const n=Math.ceil(+date.slice(8)/7); return (r.nth||[]).includes(n); }
  return true;
}
const weekOn=(s,date,siteId)=>(s?.week||[]).filter(e=>e.wd===wdOf(date)&&(!siteId||e.siteId===siteId)&&weekRuleHit(e,date));
/* この現場で入る曜日（週の型があればそれ、なければ共通の「出勤できる曜日」） */
function siteDaysOf(s,siteId,date){
  const es=(s?.week||[]).filter(e=>e.siteId===siteId&&(!e.from||date>=e.from)&&(!e.to||date<=e.to));
  if(es.length) return [...new Set(es.map(e=>e.wd))];
  const d=s?.cond?.days; return d?.length?d:null;
}
function planDaysAll(s,date){
  const d=s?.cond?.days; if(d?.length) return d;
  const es=(s?.week||[]).filter(e=>(!e.from||date>=e.from)&&(!e.to||date<=e.to));
  return es.length?[...new Set(es.map(e=>e.wd))]:null;
}
const ruleLabel=e=>{ const r=e.rule||{kind:'all'}; return r.kind==='nth'?`第${(r.nth||[]).join('・')}週`:WEEK_RULE_L[r.kind]||'毎週'; };
/* 勤務パターンの「おまかせ」：その日に人が足りないパターン → 入れるパターンの順 */
function pickPat(s,siteId,areaId,cells,day,wd){
  const sk=Object.keys(s.skills||{});
  const ps=patsOf(siteId,areaId||undefined).filter(p=>sk.includes(p.id)&&(!areaId||!p.areaId||p.areaId===areaId));
  const a=areaId?get('areas',areaId):(scopeList(siteId)[0]||null);
  for(const p of ps){ const need=needOf(a,p.id,wd); const have=Object.entries(cells).filter(([k])=>k.endsWith('|'+day)).reduce((n,[,arr])=>n+arr.filter(c=>c.p===p.id).length,0); if(need>have) return p; }
  return ps[0]||null;
}
/* 週の型・出勤指定をシフトに入れる（自動作成の最初に行う） */
function planPlace(siteId,ym,areaScope,cells){
  const days=daysOfMonth(ym); let n=0; const miss=[], warn=[];
  const ppl=staffList().filter(s=>(s.week||[]).some(e=>e.siteId===siteId)||all('wishes').some(w=>w.kind==='fix'&&w.staffId===s.id&&w.siteId===siteId&&ymOf(w.date)===ym));
  const put1=(s,day,p,areaId,src,lock)=>{ const k=`${s.id}|${day}`; const arr=cells[k]||[]; if(arr.some(c=>c.p===p.id)) return; if(areaScope&&(areaId||p.areaId||'')!==areaScope&&!(get('areas',areaScope)?.whole)) return; cells[k]=[...arr,{p:p.id,a:areaId||p.areaId||'',...(lock?{l:1}:{}),src}]; n++; };
  for(const s of ppl) days.forEach((date,di)=>{ const day=di+1, wd=wdOf(date);
    const fx=fixesOf(s.id,date), w=wishOf(s.id,date);
    if(fx.length){
      fx.filter(f=>f.siteId===siteId).forEach(f=>{ const p=(f.patId&&get('patterns',f.patId))||pickPat(s,siteId,f.areaId,cells,day,wd); if(!p){ miss.push(`${jd(date)} ${s.name}（出勤指定：入れる勤務パターンなし）`); return; } put1(s,day,p,f.areaId,'fix',true); if(w&&w.kind!=='on') warn.push(`${jd(date)} ${s.name}：出勤指定と${WISH[w.kind]?.t||'休み'}が重なっています`); });
      return; }
    if(w&&w.kind!=='on') return;
    weekOn(s,date,siteId).forEach(e=>{ const p=(e.patId&&get('patterns',e.patId))||pickPat(s,siteId,e.areaId,cells,day,wd); if(!p){ miss.push(`${jd(date)} ${s.name}（週の型：入れる勤務パターンなし）`); return; } put1(s,day,p,e.areaId,'week',false); });
  });
  return {n,miss,warn};
}
function runAuto(siteId,ym,areaScope,mode){
  const d0=shiftDoc(siteId,ym); const cells=structuredClone(d0.cells||{});
  const inScope=c=>!areaScope||c.a===areaScope;
  if(mode==='rebuild') for(const k of Object.keys(cells)) cells[k]=(cells[k]||[]).filter(c=>c.l||!inScope(c));
  const pl=planPlace(siteId,ym,areaScope,cells);
  if(mode==='plan') return {cells,added:pl.n,shorts:[],plan:pl};
  const r=runAuto0(siteId,ym,areaScope,'fill',cells);
  return {...r,added:r.added+pl.n,plan:pl};
}

const HOLC={};
function jpHolidays(y){
  if(HOLC[y]) return HOLC[y]; const m=new Map(); const ds=(mo,d)=>`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const nthMon=(mo,n)=>{ const f=new Date(y,mo-1,1).getDay(); return 1+((8-f)%7)+(n-1)*7; };
  [[1,1,'元日'],[2,11,'建国記念の日'],[2,23,'天皇誕生日'],[4,29,'昭和の日'],[5,3,'憲法記念日'],[5,4,'みどりの日'],[5,5,'こどもの日'],[8,11,'山の日'],[11,3,'文化の日'],[11,23,'勤労感謝の日']].forEach(([a,b,n])=>m.set(ds(a,b),n));
  m.set(ds(1,nthMon(1,2)),'成人の日'); m.set(ds(7,nthMon(7,3)),'海の日'); m.set(ds(9,nthMon(9,3)),'敬老の日'); m.set(ds(10,nthMon(10,2)),'スポーツの日');
  const k=Math.floor((y-1980)/4); m.set(ds(3,Math.floor(20.8431+0.242194*(y-1980))-k),'春分の日'); m.set(ds(9,Math.floor(23.2488+0.242194*(y-1980))-k),'秋分の日');
  for(const d of [...m.keys()].sort()){ if(parseD(d).getDay()===0){ let x=addDays(d,1); while(m.has(x)) x=addDays(x,1); m.set(x,'振替休日'); } }
  for(const d of [...m.keys()].sort()){ const x=addDays(d,2); if(m.has(x)&&!m.has(addDays(d,1))&&parseD(addDays(d,1)).getDay()!==0) m.set(addDays(d,1),'国民の休日'); }
  return HOLC[y]=m;
}

  return {max:m,its:os.map(o=>o.it)};
}
const whoOf=it=>(it.staffIds||[]).map(staffName).filter(Boolean).join('・');
function resProblems(x,excl){
  const out=[]; if(!x.date) return out; const sp=spanOf(x);
  for(const {id,n} of x.res||[]){
    const r=get('resources',id), b=resBlock(r,x.date);
    if(b){ out.push(`${resLabel(r)}：${jd(x.date)}は${b}`); continue; }
    const q=Math.max(1,+r.qty||1), u=resUse(id,sp,excl);
    if(u.max+(+n||1)>q) out.push(`${resLabel(r)}：${jd(x.date)} ${timeRange(x.start,x.end)}は「${u.its.slice(0,2).map(i=>i.title+(whoOf(i)?`（${whoOf(i)}）`:'')).join('」「')}」で使用中${q>1?`（${q}台中${u.max}台）`:''}`);
  }
  return out;
}
const exclOf=(col,id,root)=>it=>(id&&it.key===col+':'+id)||(!!root&&it.root===root);
/* 予定（繰り返しは今後の全回）を確認 */
function resCheckEvent(e,r){
  if(!(e.res||[]).length) return [];
  const root=e.seriesId?(e.rootId||e.seriesId):'', excl=exclOf('events',e.id,root);
  let xs=[{date:e.date,start:e.start,end:e.end}];
  if(r&&r.kind&&r.kind!=='none'){ const times=[{start:e.start||'',end:e.end||''},...(r.times||[])]; xs=ruleDates(r,e.date,horizonOf(r),e.date).flatMap(o=>times.map(t=>({date:o.date,start:t.start,end:t.end}))); }
  const out=[]; for(const x of xs){ out.push(...resProblems({...x,res:e.res},excl)); if(out.length>=3) break; }
  return out;
}

function qcalc(q){
  let sub=0,cost=0;
  (q?.lines||[]).forEach(l=>{const n=num(l.qty);sub+=n*num(l.price);cost+=n*num(l.cost);});
  const rate=num(S().taxRate)/100; const tax=Math.floor(sub*rate);
  return {sub,tax,total:sub+tax,cost,gp:sub-cost,gpr:sub?(sub-cost)/sub:0};
}

function jobMoney(j){
  const qs=jobQuotes(j.id); const wons=qs.filter(q=>q.status==='受注');
  const used=wons.length?wons:qs.filter(q=>q.status!=='失注').slice(-1);
  const c=used.reduce((a,q)=>{const x=qcalc(q); a.sub+=x.sub; a.cost+=x.cost; return a;},{sub:0,cost:0});
  const os=jobOrders(j.id).filter(o=>o.status!=='作成中'&&o.status!=='中止');
  const sales=used.length?c.sub:num(j.expectedAmount); const cost=(os.length?os.reduce((a,o)=>a+qcalc(o).sub,0):c.cost)+num(j.extraCost);
  return {sales,cost,gp:sales-cost,gpr:sales?(sales-cost)/sales:0,fixed:wons.length>0,quote:used[0],used,wonCount:wons.length,byOrder:os.length>0};
}
function cycleText(cy){
  if(!cy||!cy.kind) return '未設定';
  if(cy.kind==='flat') return '日常・月額';
  if(cy.kind==='months'){const m=(cy.months||[]).slice().sort((a,b)=>a-b); if(m.length===12) return '毎月'; if(!m.length) return '未設定'; return m.join('・')+'月';}
  if(cy.kind==='interval'){const e=+cy.every||1; if(e===1)return '毎月'; if(e===12)return '年1回'; if(e%12===0)return `${e/12}年ごと`; return `${e}か月ごと`;}
  return '未設定';
}
function cycleMonths(c,fromYm,n){
  const out=[]; const cy=c.cycle||{};
  for(let i=0;i<n;i++){
    const m=ymAdd(fromYm,i);
    if(c.start&&m<ymOf(c.start)) continue; if(c.end&&m>ymOf(c.end)) continue;
    const mo=+m.slice(5);
    if(cy.kind==='months'&&(cy.months||[]).map(Number).includes(mo)) out.push(m);
    else if(cy.kind==='interval'){const a=cy.anchor||ymOf(c.start)||fromYm;const d=ymDiff(a,m);if(d>=0&&d%(+cy.every||1)===0) out.push(m);}
  }
  return out;
}

function fyStartOf(ym){ const sm=num(S().fyStartMonth)||10; const y=+ym.slice(0,4), m=+ym.slice(5); return `${m>=sm?y:y-1}-${pad(sm)}`; }
function fyLabel(fs){ const base=num(S().fyBaseNo); const y=+fs.slice(0,4); const end=ymAdd(fs,11); const range=`${y}年${+fs.slice(5)}月〜${end.slice(0,4)}年${+end.slice(5)}月`; return base?{name:`第${base+(y-2026)}期`,range}:{name:`${y}年${+fs.slice(5)}月期`,range}; }
const recogShift=c=>c&&c.recog==='next'?1:0;
const recM=(c,m)=>ymAdd(m,recogShift(c));
function contractRevenueIn(c,fromYm,n){ // 計上月ベースで期間内の売上
  if(c.active===false) return 0; const sh=recogShift(c); let tot=0;
  if(c.cycle?.kind==='flat'){ for(let i=0;i<n;i++){ const w=ymAdd(ymAdd(fromYm,i),-sh); if(c.start&&w<ymOf(c.start)) continue; if(c.end&&w>ymOf(c.end)) continue; tot+=contractUnit(c,w);} return tot; }
  return cycleMonths(c,ymAdd(fromYm,-sh),n).reduce((a,m)=>a+contractUnit(c,m),0);
}
function monthlyForecast(fromYm,n){
  const rows=[];for(let i=0;i<n;i++) rows.push({m:ymAdd(fromYm,i),rec:0,spot:0,cost:0,revC:0});
  const idx=m=>rows.findIndex(r=>r.m===m);
  all('contracts').filter(c=>c.active!==false).forEach(c=>{
    if(c.cycle?.kind==='flat'){const sh=recogShift(c); rows.forEach(r=>{ const w=ymAdd(r.m,-sh); if(c.start&&w<ymOf(c.start))return; if(c.end&&w>ymOf(c.end))return; r.rec+=contractUnit(c,w); r.cost+=contractCostUnit(c,w); if(contractCostUnit(c,w)) r.revC+=contractUnit(c,w);});}
  });
  const seen=new Set();
  all('visits').forEach(v=>{ if(!v.contractId) return; const c=get('contracts',v.contractId); if(!c||c.active===false||c.cycle?.kind==='flat') return; seen.add(c.id+'|'+vMonth(v)); const i=idx(recM(c,vMonth(v))); if(i<0) return; if(v.status==='中止') return; rows[i].rec+=visitAmount(v); rows[i].cost+=visitCost(v); if(visitCost(v)) rows[i].revC+=visitAmount(v); });
  // 作業予定がまだ無い月は、契約の周期から見込む
  all('contracts').filter(c=>c.active!==false&&c.cycle?.kind!=='flat').forEach(c=>{ cycleMonths(c,ymAdd(fromYm,-1),n+1).forEach(m=>{ if(seen.has(c.id+'|'+m)) return; const i=idx(recM(c,m)); if(i<0) return; rows[i].rec+=contractUnit(c,m); rows[i].cost+=contractCostUnit(c,m); if(contractCostUnit(c,m)) rows[i].revC+=contractUnit(c,m); }); });
  all('jobs').forEach(j=>{ if(!['受注','施工','完了'].includes(j.stage)||j.contractId||j.type==='定期') return; const m=ymOf(j.workDate||j.expectedDate||j.updatedAt); const i=idx(m); if(i<0) return; const mo=jobMoney(j); rows[i].spot+=mo.sales; rows[i].cost+=mo.cost; if(mo.cost) rows[i].revC+=mo.sales; });
  return rows;
}
function followups(){

function recurringCandidates(){ // 定期未提案：完了したスポット案件で、その現場に有効な定期契約がない

}

function loadPrefs(){ try{ const p=JSON.parse(localStorage.getItem('okg-prefs')||'{}'); if(Array.isArray(p.schedStaff)) VS.schedStaff=p.schedStaff; if(Array.isArray(p.jobOwners)) VS.jobOwners=p.jobOwners; if(p.schedView) VS.schedView=p.schedView==='month'&&!p.v2?'month':p.schedView; }catch(_){} }
function savePrefs(){ try{ localStorage.setItem('okg-prefs',JSON.stringify({schedStaff:VS.schedStaff,jobOwners:VS.jobOwners,schedView:VS.schedView,v2:1})); }catch(_){} }

/* ---------- 担当の色 ---------- */
function staffColor(id){ if(!id) return 'pn'; const i=staffList().findIndex(s=>s.id===id); return i<0?'pn':'p'+(i%8); }
const shortStaff=n=>String(n||'').replace(/^定期清掃\s*/,'').replace(/[（(].*?[)）]/g,'').trim()||n;

/* ---------- 担当で絞り込み ---------- */
function staffShown(v){ const set=VS.schedStaff; if(!set) return true; const ids=v.staffIds||[]; if(!ids.length) return set.includes('__none'); return ids.some(i=>set.includes(i)); }
function schedRows(){ const list=[...staffList(),{id:'',name:'担当未定',kind:''}]; const set=VS.schedStaff; return set?list.filter(s=>set.includes(s.id||'__none')):list; }
function countMonthStaff(id){ const m=VS.schedView==='month'||VS.schedView==='board'?(VS.monthView||ymOf(today())):ymOf(VS.weekStart||today()); return all('visits').filter(v=>vMonth(v)===m&&(id?(v.staffIds||[]).includes(id):!(v.staffIds||[]).length)).length; }
const activeJobsOf=id=>all('jobs').filter(j=>!['完了','失注'].includes(j.stage)&&(j.ownerId||'')===id).length;
const PICK={
  sched:{get:()=>VS.schedStaff,set:v=>{VS.schedStaff=v;},title:'表示する担当',unit:()=>`${+(VS.schedView==='month'||VS.schedView==='board'?(VS.monthView||ymOf(today())):ymOf(VS.weekStart||today())).slice(5)}月`,
    opts:()=>[...staffList().map(s=>({id:s.id,name:s.name,group:s.kind==='協力会社'?'協力会社':'社員',color:staffColor(s.id),n:countMonthStaff(s.id)})),{id:'__none',name:'担当未定',group:'その他',color:'pn',n:countMonthStaff('')}],
    quick:()=>[['all','すべて'],['emp','社員のみ'],...(partners().length?[['ptn','協力会社のみ']]:[]),['none','クリア']]},
  job:{get:()=>VS.jobOwners,set:v=>{VS.jobOwners=v;},title:'表示する営業担当',unit:()=>'進行中',
    opts:()=>[...salesStaff().map(s=>({id:s.id,name:s.name,group:'営業担当',n:activeJobsOf(s.id)})),{id:'__none',name:'担当未設定',group:'その他',n:activeJobsOf('')}],
    quick:()=>[['all','すべて'],['none','クリア']]},
};
function pickerBtn(k){
  const P=PICK[k], sel=P.get(), opts=P.opts();
  const chosen=sel?opts.filter(o=>sel.includes(o.id)):opts;
  const label=!sel?'担当：すべて':!chosen.length?'担当：未選択':chosen.length<=2?'担当：'+chosen.map(o=>shortStaff(o.name)).join('・'):`担当：${chosen.length}人`;
  const dots=k==='sched'&&sel?`<span class="dd">${chosen.slice(0,5).map(o=>`<i style="background:var(--${o.color})"></i>`).join('')}</span>`:'';
  return `<button class="pbtn ${sel?'on':''}" data-act="picker" data-k="${k}" aria-haspopup="dialog" aria-expanded="${VS.picker&&VS.picker.k===k}">${dots}<span class="pl">${esc(label)}</span><span class="car">▾</span></button>`;
}
function pickerPanel(){
  const k=VS.picker.k, P=PICK[k], sel=P.get(), opts=P.opts(), on=id=>!sel||sel.includes(id);
  const mob=innerWidth<=700, r=VS.picker.r||{bottom:80,left:20};
  const pos=mob?'':`style="top:${Math.round(Math.min(r.bottom+6,innerHeight-200))}px;left:${Math.round(Math.max(8,Math.min(r.left,innerWidth-292)))}px"`;
  const groups=[...new Set(opts.map(o=>o.group))];
  return `<div class="scrim ${mob?'':'clear'}" data-act="picker-close"></div><div class="pkpanel ${mob?'mob':''}" ${pos} role="dialog" aria-label="${P.title}">${mob?`<div class="grab"></div><b class="pkt">${P.title}</b>`:''}
    <div class="qrow">${P.quick().map(([v,l])=>`<button data-act="pick-q" data-v="${v}">${l}</button>`).join('')}</div>
    ${groups.map(g=>`<div class="grp">${esc(g)}</div>`+opts.filter(o=>o.group===g).map(o=>`<label class="opt"><input type="checkbox" data-pkopt="${esc(o.id)}" ${on(o.id)?'checked':''}>${o.color?`<i style="background:var(--${o.color})"></i>`:''}<span>${esc(o.name)}</span><small>${P.unit()} ${o.n}件</small></label>`).join('')).join('')}
    ${mob?'<button class="btn pri pkclose" data-act="picker-close">閉じる</button>':''}</div>`;
}
function pickToggle(id,checked){
  const P=PICK[VS.picker.k], ids=P.opts().map(o=>o.id); let sel=P.get()?[...P.get()]:[...ids];
  sel=checked?[...new Set([...sel,id])]:sel.filter(x=>x!==id);
  P.set(ids.every(x=>sel.includes(x))?null:sel); savePrefs(); render();
}
function pickQuick(v){
  const k=VS.picker.k, P=PICK[k];
  if(v==='all') P.set(null); else if(v==='none') P.set([]);
  else if(v==='emp') P.set(employees().map(s=>s.id)); else if(v==='ptn') P.set(partners().map(s=>s.id));
  savePrefs(); render();
}

const VIEWS={};

/* ---- ホーム ---- */
VIEWS.home={
  shell:()=>`<div class="vhead"><h1>業務ダッシュボード</h1><button class="btn" data-act="new-visit">＋ 作業予定</button><button class="btn pri" data-act="new-job">＋ 新規案件</button></div>`,
  body(){
    if(!loaded.size&&MODE==='loading') return `<p class="empty">データを読み込んでいます…</p>`;
    const t=today(), tm=ymOf(t), nm=ymAdd(tm,1);
    const fc=monthlyForecast(tm,1)[0];
    const vs=all('visits').filter(visibleVisit);
    const tmV=vs.filter(v=>v.contractId&&vMonth(v)===tm), nmV=vs.filter(v=>v.contractId&&vMonth(v)===nm);
    const active=all('jobs').filter(j=>!['完了','失注'].includes(j.stage));
    const fol=followups(), rec=recurringCandidates(), late=vs.filter(isLate);
    const unsT=tmV.filter(v=>!v.date&&isOpenVisit(v)).length, unsN=nmV.filter(v=>!v.date&&isOpenVisit(v)).length;
    const fsN=flowStale().length; const alerts=[...apHomeAlerts(),...(fsN?[['w',fsN,'止まっている案件（要確認）','jobs','check']]:[]),...poHomeAlerts()];
    if(late.length) alerts.push(['r',late.length,'予定日を過ぎて未完了の作業','schedule','late']);
    if(unsT) alerts.push(['w',unsT,`今月（${+tm.slice(5)}月）の定期作業で日程が未定`,'schedule','uns']);
    alerts.push(['a',nmV.length,`来月（${+nm.slice(5)}月）の定期作業${unsN?`／うち日程未定 ${unsN}件`:''}`,'schedule','next']);
    if(false&&fol.length) alerts.push(['w',fol.length,`見積提出後 ${S().followDays}日以上フォローしていない案件`,'jobs','follow']);
    if(rec.length) alerts.push(['g',rec.length,'完了したスポット案件で、定期契約をまだ提案していない','jobs','rec']);
    const dn=all('jobs').filter(jobAllDone).length; if(false&&dn) alerts.push(['g',dn,'作業がすべて終わった案件（完了処理待ち）','jobs','done']);
    const todays=vs.filter(v=>v.date===t).sort(by(v=>v.start||''));
    const week=[];for(let i=1;i<7;i++){const d=addDays(t,i);const l=vs.filter(v=>v.date===d);if(l.length)week.push([d,l]);}
    return `
    <div class="kpis">
      <div class="kpi"><div class="l">今月の売上見込み</div><div class="v num">${man(fc.rec+fc.spot)}</div><div class="s">定期 ${man(fc.rec)}／スポット ${man(fc.spot)}</div></div>
      ${can('cost.view')?`<div class="kpi"><div class="l">今月の粗利見込み</div>${fc.cost&&fc.revC>0?`<div class="v num">${man(fc.revC-fc.cost)}</div><div class="s">粗利率 ${Math.round((fc.revC-fc.cost)/fc.revC*100)}%（原価入力済みの売上 ${Math.round(fc.revC/Math.max(1,fc.rec+fc.spot)*100)}%分で計算）</div>`:`<div class="v num muted">—</div><div class="s">原価が未入力です（定期契約・見積で入力）</div>`}</div>`:''}
      ${(()=>{const fs=fyStartOf(tm), f=monthlyForecast(fs,12), tot=f.reduce((a,r)=>a+r.rec+r.spot,0), past=f.filter(r=>r.m<tm).reduce((a,r)=>a+r.rec+r.spot,0); return `<div class="kpi"><div class="l">今期（${fyLabel(fs).name}）の売上</div><div class="v num">${man(tot)}</div><div class="s">実績 ${man(past)}／見込み ${man(tot-past)}</div></div>`;})()}
      <div class="kpi"><div class="l">有効な定期契約</div><div class="v num">${all('contracts').filter(c=>c.active!==false).length}件</div><div class="s">今月の定期作業 ${tmV.length}件（完了 ${tmV.filter(v=>v.status==='完了').length}）</div></div>
      <div class="kpi"><div class="l">進行中の案件</div><div class="v num">${active.length}件</div><div class="s">見積中 ${active.filter(j=>j.stage==='見積').length}件</div></div>
    </div>
    <div class="grid2">
      <section class="panel"><h2>対応が必要なこと</h2><div class="pbody"><div class="alerts">
        ${alerts.map(([tone,n,l,r,f])=>`<button class="alert ${tone}" ${r==='po'?'data-sgo="go" data-m="S" data-r="porders"':r==='ap'?'data-act="ap-list"':r==='unreg'?'data-sgo="go" data-m="S" data-r="relations"':r==='rsend'?'data-act="rs-list"':`data-act="alert" data-r="${r}" data-f="${f}"`}><span class="bar"></span><b>${n}</b><span>${esc(l)}</span></button>`).join('')}
      </div></div></section>
      <section class="panel"><h2>今日の作業　<span class="muted small">${jd(t)}</span></h2><div class="pbody">
        ${todays.length?`<div class="list">${todays.map(visitLi).join('')}</div>`:`<p class="empty">今日の予定はありません。</p>`}
        <h3 style="font-size:13px;margin:14px 0 4px" class="muted">この先1週間</h3>
        ${week.length?week.map(([d,l])=>`<div class="small" style="margin-top:6px"><b>${jd(d)}</b>　${l.slice(0,4).map(v=>esc(visitTitle(v))).join('、')}${l.length>4?` ほか${l.length-4}件`:''}</div>`).join(''):`<p class="empty">予定はありません。</p>`}
      </div></section>
    </div>`;
  }
};
const isSelV=id=>VS.placing===id||!!(VS.multi&&VS.multi.has(id));
const tgtMode=()=>!!(VS.placing||(VS.multi&&VS.multi.size));
function visitLi(v){
  const tone=v.status==='完了'?'g':isLate(v)?'r':'';
  const who=(v.staffIds||[]).map(staffName).filter(Boolean).join('・')||'担当未定';
  return `<div class="li ${VS.multi&&VS.multi.has(v.id)?'msel':''}" data-act="visit" data-id="${v.id}">${VS.multi&&VS.route==='schedule'?`<span class="mchk" aria-hidden="true">${VS.multi.has(v.id)?'✓':''}</span>`:''}<span class="pill ${tone}">${esc(v.status||'予定')}</span><div class="grow"><div>${esc(visitTitle(v))}${exMark(v)}</div><div class="small muted">${v.date?jd(v.date):'日程未定（'+esc(v.month||'')+'）'}${v.start||v.end?' '+esc(timeRange(v.start,v.end)):''}　${esc(who)}</div></div>${v.contractId?`<span class="num small muted">${man(visitAmount(v))}</span>`:''}</div>`;
}

/* ---- 案件 ---- */
VIEWS.jobs={
  shell:()=>`<div class="vhead"><h1>案件</h1><button class="btn pri" data-act="new-job">＋ 新規案件</button></div>
   <div class="toolbar">
     <input class="inp search" id="jobQ" placeholder="案件名・顧客・現場で検索" value="${esc(VS.jobQ)}">
     <span class="toolbar" id="tools" style="margin:0"></span>
   </div>`,
  tools:()=>`${pickerBtn('job')}${jobMonthSel()}<select class="inp ${VS.jobType?'on':''}" id="jobType" style="width:auto" aria-label="種別">${opt('','種別：すべて',VS.jobType)}${opt('スポット','種別：スポット',VS.jobType)}${opt('定期','種別：定期',VS.jobType)}</select>${VS.jobView==='archive'?`<select class="inp ${VS.arcRes?'on':''}" id="arcRes" style="width:auto" aria-label="結果">${opt('','結果：すべて',VS.arcRes)}${opt('完了','結果：完了',VS.arcRes)}${opt('失注','結果：失注',VS.arcRes)}</select>`:''}
     <div class="seg" role="group" aria-label="表示">${[['board','ボード','ボード'],['check','要確認','要確認'],['follow','要フォロー','要フォロー'],['rec','定期未提案','定期化'],['list','一覧','一覧'],['people','担当者別','担当'],['archive','過去の案件','過去']].map(([k,l,sh])=>`<button data-act="jobview" data-v="${k}" aria-pressed="${VS.jobView===k}"><span class="lg">${l}</span><span class="sm">${sh}</span></button>`).join('')}</div>`,
  body(){
    const q=VS.jobQ.trim();
    const os=VS.jobOwners;
    let js=all('jobs').filter(j=>(!os||os.includes(j.ownerId||'__none'))&&(!VS.jobMonth||jobMonthKey(j)===VS.jobMonth)&&(!VS.jobType||j.type===VS.jobType)&&(!q||[j.title,j.no,custName(j.customerId),siteName(j.siteId),j.service].join(' ').includes(q)));
    if(VS.jobView==='follow'){
      const ids=new Set(followups().map(x=>x.jobId)); js=js.filter(j=>ids.has(j.id));
      return `<p class="small muted" style="margin:0 0 10px">見積を提出して${S().followDays}日以上たち、その後の連絡記録がない案件です。連絡したら案件の「連絡した」を押してください。</p>`+jobTable(js);
    }
    if(VS.jobView==='rec'){
      const ids=new Set(recurringCandidates().map(x=>x.id)); js=js.filter(j=>ids.has(j.id));
      return `<p class="small muted" style="margin:0 0 10px">完了したスポット案件のうち、その現場に有効な定期契約がないものです。案件を開いて「定期契約にする」で契約を登録できます。</p>`+jobTable(js);
    }
    if(VS.jobView==='check') return flowCheckTable(js);
    if(VS.jobView==='people') return peopleTable(all('jobs'));
    if(VS.jobView==='archive') return archiveTable(js.filter(isArchived).filter(j=>!VS.arcRes||j.stage===VS.arcRes));
    js=js.filter(j=>!isArchived(j));
    if(VS.jobView==='list') return jobTable(js.sort(by(j=>j.updatedAt||'',-1)));
    const fol=new Set(followups().map(x=>x.jobId));
    return `<div class="kanban">${STAGES.map(st=>{
      const l=js.filter(j=>(j.stage||'依頼受付')===st).sort(by(j=>j.updatedAt||'',-1));
      const sum=l.reduce((a,j)=>a+jobMoney(j).sales,0);
      return `<div class="col" data-drop-stage="${st}"><div class="colh"><span class="pill ${STAGE_TONE[st]}">${st}</span><span class="num">${l.length}</span><span class="sum num">${man(sum)}</span></div>${st==='完了'||st==='失注'?`<div class="small muted" style="margin:-6px 4px 8px">直近${num(S().archiveDays)||30}日分。古いものは「過去の案件」へ</div>`:''}<div class="cards">${
        l.map(j=>{const m=jobMoney(j);return `<div class="card" draggable="true" data-drag-job="${j.id}" data-act="job" data-id="${j.id}">
          <div class="tt">${esc(j.title)}${exMark(j)}</div>
          <div class="meta"><span>${esc(custName(j.customerId))}</span></div>
          <div class="meta">${j.type==='定期'?'<span class="pill a">定期</span>':'<span class="pill">スポット</span>'}${fol.has(j.id)?'<span class="pill w">要フォロー</span>':''}<span>${esc(staffName(j.ownerId)||'担当未定')}</span><span class="amt num">${m.sales?man(m.sales):''}</span></div>
          ${flowCardLine(j)}
        </div>`;}).join('')||'<p class="empty small" style="padding:4px">なし</p>'}</div></div>`;}).join('')}</div>`;
  }
};
function archiveTable(js){
  js=js.sort(by(j=>jobClosedDate(j),-1));
  const days=num(S().archiveDays)||30;
  if(!js.length) return `<p class="small muted" style="margin:0 0 10px">完了・失注にしてから${days}日を過ぎた案件が、ここに自動で移ります。</p><p class="empty">該当する案件はありません。</p>`;
  const won=js.filter(j=>j.stage==='完了'), lost=js.filter(j=>j.stage==='失注');
  const ws=won.reduce((a,j)=>a+jobMoney(j).sales,0), wc=won.reduce((a,j)=>a+jobMoney(j).cost,0);
  return `<p class="small muted" style="margin:0 0 10px">完了・失注にしてから${days}日を過ぎた案件です（期間は「マスタ・設定 → 会社・連携」で変更できます）。段階を戻すとボードに戻ります。</p>
  <div class="kpis"><div class="kpi"><div class="l">完了</div><div class="v num">${won.length}件</div><div class="s">売上 ${man(ws)}${can('cost.view')&&wc?`／粗利率 ${ws?Math.round((ws-wc)/ws*100):0}%`:''}</div></div><div class="kpi"><div class="l">失注</div><div class="v num">${lost.length}件</div><div class="s">${man(lost.reduce((a,j)=>a+jobMoney(j).sales,0))}</div></div></div>
  <div class="panel scroll"><table class="t"><thead><tr><th>終了日</th><th>案件</th><th>顧客／現場</th><th>結果</th><th>担当</th><th class="r">金額</th><th class="r">粗利率</th><th>失注理由</th></tr></thead><tbody>${
    js.map(j=>{const m=jobMoney(j);return `<tr class="click" data-act="job" data-id="${j.id}"><td class="num small">${esc(jobClosedDate(j))}</td><td><b>${esc(j.title)}</b><div class="small muted">${esc(j.no||'')}　${esc(j.type||'')}</div></td><td>${esc(custName(j.customerId))}<div class="small muted">${esc(siteName(j.siteId))}</div></td><td><span class="pill ${STAGE_TONE[j.stage]}">${esc(j.stage)}</span></td><td>${esc(staffName(j.ownerId))}</td><td class="r num">${man(m.sales)}</td><td class="r num">${can('cost.view')&&m.sales&&m.cost&&j.stage==='完了'?Math.round(m.gpr*100)+'%':''}</td><td class="small">${esc(j.lostReason||'')}</td></tr>`;}).join('')}</tbody></table></div>`;
}
function jobTable(js){
  if(!js.length) return `<p class="empty">該当する案件はありません。</p>`;
  return `<div class="panel scroll"><table class="t"><thead><tr><th>案件</th><th>顧客／現場</th><th>段階</th><th>担当</th><th class="r">金額</th><th class="r">粗利率</th><th>更新</th></tr></thead><tbody>${
    js.map(j=>{const m=jobMoney(j);return `<tr class="click" data-act="job" data-id="${j.id}"><td><b>${esc(j.title)}</b>${exMark(j)}<div class="small muted">${esc(j.no||'')}　${esc(j.type||'')}</div></td><td>${esc(custName(j.customerId))}<div class="small muted">${esc(siteName(j.siteId))}</div></td><td><span class="pill ${STAGE_TONE[j.stage]}">${esc(j.stage)}</span></td><td>${esc(staffName(j.ownerId))}</td><td class="r num">${man(m.sales)}</td><td class="r num">${can('cost.view')&&m.sales?Math.round(m.gpr*100)+'%':''}</td><td class="small muted">${daysSince(j.updatedAt)}日前</td></tr>`;}).join('')}</tbody></table></div>`;
}

  tools(){
    if(!VS.weekStart) VS.weekStart=weekMonday(today());
    if(!VS.monthView) VS.monthView=ymOf(today());
    const ws=VS.weekStart, isM=VS.schedView==='month'||VS.schedView==='board';
    const nav=isM?`<button class="btn sm" data-act="mon" data-d="-1">‹ 前月</button><button class="btn sm" data-act="mon" data-d="0">今月</button><button class="btn sm" data-act="mon" data-d="1">翌月 ›</button><b>${ymLabel(VS.monthView)}</b>`
      :`<button class="btn sm" data-act="week" data-d="-7">‹ 前週</button><button class="btn sm" data-act="week" data-d="0">今週</button><button class="btn sm" data-act="week" data-d="7">翌週 ›</button><b>${jd(ws)} 〜 ${jd(addDays(ws,6))}</b>`;
    return `<div class="seg" role="group" aria-label="表示">${[['week','週ボード','週'],['month','月カレンダー','月'],['board','担当別月','担当別'],['list','日別リスト','日別']].map(([k,l,sh])=>`<button data-act="schedview" data-v="${k}" aria-pressed="${VS.schedView===k}"><span class="lg">${l}</span><span class="sm">${sh}</span></button>`).join('')}</div>${pickerBtn('sched')}<button class="btn ${VS.multi?'pri':''}" data-act="multi" aria-pressed="${!!VS.multi}">${VS.multi?'複数選択中':'複数選択'}</button><span class="toolbar" style="margin:0">${nav}</span>`;
  },
  body(){
    if(!VS.weekStart) VS.weekStart=weekMonday(today());
    if(!VS.monthView) VS.monthView=ymOf(today());
    const ws=VS.weekStart, days=[...Array(7)].map((_,i)=>addDays(ws,i)), t=today();

function monthCalendar(vs){
  const m=VS.monthView, t=today(), [yy,mm]=m.split('-').map(Number);
  const start=weekMonday(m+'-01'), end=addDays(weekMonday(`${m}-${pad(new Date(yy,mm,0).getDate())}`),6);
  const cells=[]; for(let d=start;d<=end;d=addDays(d,1)) cells.push(d);
  if(!VS.calSel||ymOf(VS.calSel)!==m) VS.calSel=ymOf(t)===m?t:m+'-01';
  const set=VS.schedStaff;
  const col=v=>{const ids=v.staffIds||[]; const id=set?ids.find(i=>set.includes(i)):ids[0]; return staffColor(id||'');};
  const ev=v=>{const c=col(v), n=(v.staffIds||[]).length; return `<button class="cev ${v.status==='完了'?'done':isLate(v)?'late':''} ${isSelV(v.id)?'sel':''}" style="--c:var(--${c});--cs:var(--${c}s)" draggable="true" data-drag-visit="${v.id}" data-act="chip" data-id="${v.id}" data-fitem title="${esc((v.start?v.start+' ':'')+visitTitle(v)+'（'+((v.staffIds||[]).map(staffName).join('・')||'担当未定')+'）')}">${v.start?`<span class="tm">${esc(timeRange(v.start,v.end))}</span> `:''}${esc(shortTitle(v))}${n>1?` <span class="plus">+${n-1}</span>`:''}</button>`;};
  const head=['月','火','水','木','金','土','日'].map((w,i)=>`<div class="dh ${i===6?'sun':i===5?'sat':''}">${w}</div>`).join('');
  const body=cells.map(d=>{
    const l=vs.filter(v=>v.date===d).sort(by(v=>v.start||'')); const w=parseD(d).getDay();
    return `<div class="cd ${ymOf(d)!==m?'out':''} ${d===t?'today':''} ${d===VS.calSel?'sel':''} ${tgtMode()?'target':''}" data-drop-d="${d}" data-act="${tgtMode()?'place':'calday'}" data-d="${d}" data-fit>
      <div class="cdn"><span class="${w===0||(window.S_API&&S_API.hol(d))?'sun':w===6?'sat':''}">${+d.slice(8)}</span>${window.S_API&&S_API.hol(d)?`<small style="font-size:10px;color:#c33">${esc(S_API.hol(d))}</small>`:''}${l.length?`<span class="cnt">${l.length}件</span>`:''}</div>
      <div class="cevs">${l.map(ev).join('')}</div>
      <div class="cdots">${l.slice(0,6).map(v=>`<i style="background:var(--${col(v)})"></i>`).join('')}${l.length>6?'<b>+</b>':''}</div></div>`;}).join('');
  const shown=schedRows();
  const inMonth=new Set(vs.filter(v=>ymOf(v.date||'')===m).flatMap(v=>v.staffIds||[])); const legS=shown.filter(s=>inMonth.has(s.id));
  const leg=`<details class="cleg-box" ${VS.legOpen?'open':''} style="margin-top:8px"><summary class="small muted" data-act="legToggle" style="cursor:pointer">担当の色を見る（この月に予定がある${legS.length}人）　薄い色＝完了／赤枠＝予定日を過ぎて未完了</summary><div class="cleg">${legS.map(s=>`<span><i style="background:var(--${staffColor(s.id)})"></i>${esc(s.name)}</span>`).join('')||'<span>この月の予定はありません</span>'}</div></details>`;
  const sel=vs.filter(v=>v.date===VS.calSel).sort(by(v=>v.start||''));
  const day=`<section class="sec calday"><h3>${jd(VS.calSel)}の作業 <span class="num muted">${sel.length}件</span>${VS.placing?`<span class="sp"><button class="btn sm" data-act="place" data-d="${VS.calSel}">この日に配置</button></span>`:''}</h3>${sel.length?`<div class="list">${sel.map(visitLi).join('')}</div>`:'<p class="empty">予定はありません。</p>'}</section>`;
  return `<div class="mcal">${head}${body}</div>${leg}${day}`;
}
